ould chance to be\n    Involved in this affair,\nHe trusts to you to set them free,\n    Exactly as we were.\n\nMy notion was that you had been\n    (Before she had this fit)\nAn obstacle that came between\n    Him, and ourselves, and it.\n\nDon’t let him know she liked them best,\n    For this must ever be\nA secret, kept from all the rest,\n    Between yourself and me.”\n\n\n“That’s the most important piece of evidence we’ve heard yet,” said the\nKing, rubbing his hands; “so now let the jury—”\n\n“If any one of them can explain it,” said Alice, (she had grown so\nlarge in the last few minutes that she wasn’t a bit afraid of\ninterrupting him,) “I’ll give him sixpence. _I_ don’t believe there’s\nan atom of meaning in it.”\n\nThe jury all wrote down on their slates, “_She_ doesn’t believe there’s\nan atom of meaning in it,” but none of them attempted to explain the\npaper.\n\n“If there’s no meaning in it,” said the King, “that saves a world of\ntrouble, you know, as we needn’t try to find any. And yet I don’t\nknow,” he went on, spreading out the verses on his knee, and looking at\nthem with one eye; “I seem to see some meaning in them, after all.\n“—_said I could not swim_—” you can’t swim, can you?” he added, turning\nto the Knave.\n\nThe Knave shook his head sadly. “Do I look like it?” he said. (Which he\ncertainly did _not_, being made entirely of cardboard.)\n\n“All right, so far,” said the King, and he went on muttering over the\nverses to himself: “‘_We know it to be true_—’ that’s the jury, of\ncourse—‘_I gave her one, they gave him two_—’ why, that must be what he\ndid with the tarts, you know—”\n\n“But, it goes on ‘_they all returned from him to you_,’” said Alice.\n\n“Why, there they are!” said the King triumphantly, pointing to the\ntarts on the table. “Nothing can be clearer than _that_. Then\nagain—‘_before she had this fit_—’ you never had fits, my dear, I\nthink?” he said to the Queen.\n\n“Never!” said the Queen furiously, throwing an inkstand at the Lizard\nas she spoke. (The unfortunate little Bill had left off writing on his\nslate with one finger, as he found it made no mark; but he now hastily\nbegan again, using the ink, that was trickling down his face, as long\nas it lasted.)\n\n“Then the words don’t _fit_ you,” said the King, looking round the\ncourt with a smile. There was a dead silence.\n\n“It’s a pun!” the King added in an offended tone, and everybody\nlaughed, “Let the jury consider their verdict,” the King said, for\nabout the twentieth time that day.\n\n“No, no!” said the Queen. “Sentence first—verdict afterwards.”\n\n“Stuff and nonsense!” said Alice loudly. “The idea of having the\nsentence first!”\n\n“Hold your tongue!” said the Queen, turning purple.\n\n“I won’t!” said Alice.\n\n“Off with her head!” the Queen shouted at the top of her voice. Nobody\nmoved.\n\n“Who cares for you?” said Alice, (she had grown to her full size by\nthis time.) “You’re nothing but a pack of cards!”\n\nAt this the whole pack rose up into the air, and came flying down upon\nher: she gave a little scream, half of fright and half of anger, and\ntried to beat them off, and found herself lying on the bank, with her\nhead in the lap of her sister, who was gently brushing away some dead\nleaves that had fluttered down from the trees upon her face.\n\n“Wake up, Alice dear!” said her sister; “Why, what a long sleep you’ve\nhad!”\n\n“Oh, I’ve had such a curious dream!” said Alice, and she told her\nsister, as well as she could remember them, all these strange\nAdventures of hers that you have just been reading about; and when she\nhad finished, her sister kissed her, and said, “It _was_ a curious\ndream, dear, certainly: but now run in to your tea; it’s getting late.”\nSo Alice got up and ran off, thinking while she ran, as well she might,\nwhat a wonderful dream it had been.\n\n\nBut her sister sat still just as she left her, leaning her head on her\nhand, watching the setting sun, and thinking of little Alice and all\nher wonderful Adventures, till she too began dreaming after a fashion,\nand this was her dream:—\n\nFirst, she dreamed of little Alice herself, and once again the tiny\nhands were clasped upon her knee, and the bright eager eyes were\nlooking up into hers—she could hear the very tones of her voice, and\nsee that queer little toss of her head to keep back the wandering hair\nthat _would_ always get into her eyes—and still as she listened, or\nseemed to listen, the whole place around her became alive with the\nstrange creatures of her little sister’s dream.\n\nThe long grass rustled at her feet as the White Rabbit hurried by—the\nfrightened Mouse splashed his way through the neighbouring pool—she\ncould hear the rattle of the teacups as the March Hare and his friends\nshared their never-ending meal, and the shrill voice of the Queen\nordering off her unfortunate guests to execution—once more the pig-baby\nwas sneezing on the Duchess’s knee, while plates and dishes crashed\naround it—once more the shriek of the Gryphon, the squeaking of the\nLizard’s slate-pencil, and the choking of the suppressed guinea-pigs,\nfilled the air, mixed up with the distant sobs of the miserable Mock\nTurtle.\n\nSo she sat on, with closed eyes, and half believed herself in\nWonderland, though she knew she had but to open them again, and all\nwould change to dull reality—the grass would be only rustling in the\nwind, and the pool rippling to the waving of the reeds—the rattling\nteacups would change to tinkling sheep-bells, and the Queen’s shrill\ncries to the voice of the shepherd boy—and the sneeze of the baby, the\nshriek of the Gryphon, and all the other queer noises, would change\n(she knew) to the confused clamour of the busy farm-yard—while the\nlowing of the cattle in the distance would take the place of the Mock\nTurtle’s heavy sobs.\n\nLastly, she pictured to herself how this same little sister of hers\nwould, in the after-time, be herself a grown woman; and how she would\nkeep, through all her riper years, the simple and loving heart of her\nchildhood: and how she would gather about her other little children,\nand make _their_ eyes bright and eager with many a strange tale,\nperhaps even with the dream of Wonderland of long ago: and how she\nwould feel with all their simple sorrows, and find a pleasure in all\ntheir simple joys, remembering her own child-life, and the happy summer\ndays.\n\nTHE END"};})();

<script>
/* ==== 02_store.js ==== */
/* 02_store.js — IndexedDB storage layer with in-memory fallback, settings cache, backup export/import */
(function(){
'use strict';
const F = window.F = window.F || {};
const S = F.store = {};

const DB_NAME = 'folio_reader';
const DB_VERSION = 1;
const STORES = {
  books:       { keyPath: 'id' },                                   // metadata shown on the shelf
  content:     { keyPath: 'bookId' },                               // { bookId, chapters:[{title, paras:[...], pwc:[...]}] }
  progress:    { keyPath: 'bookId' },                               // { bookId, loc, percent, physicalPage, updatedAt }
  sessions:    { keyPath: 'id', indexes: [['bookId','bookId'], ['day','day']] },
  calibration: { keyPath: 'bookId' },                               // { bookId, points:[{page, g, loc, confidence, at}], totalPages }
  audio:       { keyPath: 'key', indexes: [['bookId','bookId']] },  // cached TTS audio per paragraph
  settings:    { keyPath: 'key' },
  scans:       { keyPath: 'id', indexes: [['bookId','bookId']] },   // photographed page thumbnails (optional)
};

let dbPromise = null;
let memory = null;
S.available = true;
S.mode = 'indexeddb';

function memInit(){
  memory = {};
  for (const k of Object.keys(STORES)) memory[k] = new Map();
  S.available = false;
  S.mode = 'memory';
}

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { return reject(e); }
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const [name, def] of Object.entries(STORES)) {
        if (!db.objectStoreNames.contains(name)) {
          const os = db.createObjectStore(name, { keyPath: def.keyPath });
          (def.indexes || []).forEach(([iname, kp]) => os.createIndex(iname, kp));
        }
      }
    };
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => { try { db.close(); } catch (e) {} dbPromise = null; };
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
    req.onblocked = () => reject(new Error('IndexedDB blocked by another tab'));
    setTimeout(() => reject(new Error('IndexedDB open timed out')), 8000);
  }).catch(err => {
    console.warn('[store] falling back to memory store:', err && err.message);
    memInit();
    return null;
  });
  return dbPromise;
}

function reqp(r){
  return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
function txDone(t){
  return new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('transaction aborted')); });
}
function keyOf(store, val){ return val[STORES[store].keyPath]; }

S.ready = () => openDB().then(() => S.available);

S.get = async (store, key) => {
  const db = await openDB();
  if (!db) return memory[store].get(key);
  return reqp(db.transaction(store).objectStore(store).get(key));
};
S.put = async (store, val) => {
  const db = await openDB();
  if (!db) { memory[store].set(keyOf(store, val), val); return val; }
  const t = db.transaction(store, 'readwrite');
  t.objectStore(store).put(val);
  await txDone(t);
  return val;
};
S.putMany = async (store, vals) => {
  const db = await openDB();
  if (!db) { vals.forEach(v => memory[store].set(keyOf(store, v), v)); return vals.length; }
  const t = db.transaction(store, 'readwrite');
  const os = t.objectStore(store);
  vals.forEach(v => os.put(v));
  await txDone(t);
  return vals.length;
};
S.del = async (store, key) => {
  const db = await openDB();
  if (!db) { memory[store].delete(key); return; }
  const t = db.transaction(store, 'readwrite');
  t.objectStore(store).delete(key);
  await txDone(t);
};
S.all = async (store) => {
  const db = await openDB();
  if (!db) return Array.from(memory[store].values());
  return reqp(db.transaction(store).objectStore(store).getAll());
};
S.keys = async (store) => {
  const db = await openDB();
  if (!db) return Array.from(memory[store].keys());
  return reqp(db.transaction(store).objectStore(store).getAllKeys());
};
S.where = async (store, index, value) => {
  const db = await openDB();
  if (!db) return Array.from(memory[store].values()).filter(v => v[index] === value);
  return reqp(db.transaction(store).objectStore(store).index(index).getAll(value));
};
S.delWhere = async (store, index, value) => {
  const rows = await S.where(store, index, value);
  const db = await openDB();
  if (!db) { rows.forEach(r => memory[store].delete(keyOf(store, r))); return rows.length; }
  const t = db.transaction(store, 'readwrite');
  const os = t.objectStore(store);
  rows.forEach(r => os.delete(keyOf(store, r)));
  await txDone(t);
  return rows.length;
};
S.clear = async (store) => {
  const db = await openDB();
  if (!db) { memory[store].clear(); return; }
  const t = db.transaction(store, 'readwrite');
  t.objectStore(store).clear();
  await txDone(t);
};
S.count = async (store) => {
  const db = await openDB();
  if (!db) return memory[store].size;
  return reqp(db.transaction(store).objectStore(store).count());
};

// ---- settings (small key/value, cached in memory, mirrored to localStorage as a safety net) ----
const LS_KEY = 'folio_settings_mirror';
const settingsCache = {};
let settingsLoaded = false;
S.settings = {
  async load(){
    try {
      const rows = await S.all('settings');
      rows.forEach(r => { settingsCache[r.key] = r.value; });
    } catch (e) { console.warn('[settings] load failed', e); }
    if (!Object.keys(settingsCache).length) {
      try {
        const mirror = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
        Object.assign(settingsCache, mirror);
      } catch (e) {}
    }
    settingsLoaded = true;
    return settingsCache;
  },
  get(key, dflt){
    return (key in settingsCache && settingsCache[key] !== undefined) ? settingsCache[key] : dflt;
  },
  async set(key, value){
    settingsCache[key] = value;
    mirror();
    try { await S.put('settings', { key, value }); } catch (e) { console.warn('[settings] persist failed', e); }
    return value;
  },
  async remove(key){
    delete settingsCache[key];
    mirror();
    try { await S.del('settings', key); } catch (e) {}
  },
  all(){ return Object.assign({}, settingsCache); },
  get loaded(){ return settingsLoaded; },
};
function mirror(){
  try {
    const small = {};
    for (const [k, v] of Object.entries(settingsCache)) {
      const s = JSON.stringify(v);
      if (s && s.length < 4000) small[k] = v;
    }
    localStorage.setItem(LS_KEY, JSON.stringify(small));
  } catch (e) {}
}

// ---- storage estimate & persistence request ----
S.estimate = async () => {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      return { usage: e.usage || 0, quota: e.quota || 0 };
    }
  } catch (e) {}
  return null;
};
S.requestPersist = async () => {
  try {
    if (navigator.storage && navigator.storage.persist) {
      const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      if (already) return true;
      return await navigator.storage.persist();
    }
  } catch (e) {}
  return false;
};

// ---- backup export / import (JSON; audio cache excluded; API keys optional) ----
const SECRET_KEYS = ['elevenlabsKey', 'openaiKey', 'googleBooksKey'];
S.exportAll = async ({ includeKeys = false } = {}) => {
  const [books, content, progress, sessions, calibration] = await Promise.all([
    S.all('books'), S.all('content'), S.all('progress'), S.all('sessions'), S.all('calibration'),
  ]);
  const settings = {};
  for (const [k, v] of Object.entries(settingsCache)) {
    if (!includeKeys && SECRET_KEYS.includes(k)) continue;
    settings[k] = v;
  }
  return { app: 'folio', version: 1, exportedAt: new Date().toISOString(), books, content, progress, sessions, calibration, settings };
};
S.importAll = async (data, { replace = false } = {}) => {
  if (!data || data.app !== 'folio') throw new Error('Not a Folio backup file');
  if (replace) {
    for (const s of ['books', 'content', 'progress', 'sessions', 'calibration']) await S.clear(s);
  }
  const counts = {};
  for (const s of ['books', 'content', 'progress', 'sessions', 'calibration']) {
    const rows = Array.isArray(data[s]) ? data[s] : [];
    if (rows.length) await S.putMany(s, rows);
    counts[s] = rows.length;
  }
  if (data.settings && typeof data.settings === 'object') {
    for (const [k, v] of Object.entries(data.settings)) await S.settings.set(k, v);
  }
  return counts;
};

// ---- wipe everything (settings included) ----
S.wipe = async () => {
  for (const s of Object.keys(STORES)) { try { await S.clear(s); } catch (e) {} }
  for (const k of Object.keys(settingsCache)) delete settingsCache[k];
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
};
})();

</script>

/* ==== 03_text.js ==== */
/* 03_text.js — tokenizer, canonical locators, normalization, readability, plain-text (Gutenberg-aware) parser */
(function(){
'use strict';
const F = window.F = window.F || {};
const T = F.text = {};

const ABBREV = new Set(('mr mrs ms dr prof sr jr st mt vs etc no col gen lt capt sgt rev hon esq inc ltd co fig vol ch pp ed eds approx dept est ' +
  'jan feb mar apr jun jul aug sep sept oct nov dec messrs mme mlle bros hon rt viz cf ibid op').split(' '));
const TERM = '.!?…';
const CLOSERS = '"\'”’)]»';
const OPENERS = '"\'“‘([«';

function wordBefore(str, idx){
  let j = idx - 1;
  while (j >= 0 && /[A-Za-z]/.test(str[j])) j--;
  return str.slice(j + 1, idx);
}

/** Split a paragraph into sentences: [{text, start}] where start is the char offset in the paragraph. */
T.splitSentences = function(p){
  const out = [];
  const n = p.length;
  let start = 0, i = 0;
  while (i < n) {
    const ch = p[i];
    if (TERM.includes(ch)) {
      let j = i;
      while (j < n && TERM.includes(p[j])) j++;
      while (j < n && CLOSERS.includes(p[j])) j++;
      if (j >= n) break;
      if (/\s/.test(p[j])) {
        let k = j;
        while (k < n && /\s/.test(p[k])) k++;
        if (k >= n) break;
        const next = p[k];
        const prev = wordBefore(p, i);
        const abbrev = ch === '.' && (ABBREV.has(prev.toLowerCase()) || /^[A-Z]$/.test(prev));
        const startsOk = ch === '.' ? (/[A-Z0-9]/.test(next) || OPENERS.includes(next)) : !/[a-z]/.test(next);
        if (!abbrev && startsOk) { out.push({ text: p.slice(start, k), start }); start = k; }
        i = k;
        continue;
      }
      i = j;
      continue;
    }
    i++;
  }
  if (start < n) out.push({ text: p.slice(start), start });
  return out.map(s => ({ text: s.text.replace(/\s+$/, ''), start: s.start })).filter(s => s.text.length);
};

/** Split a sentence into words: [{text, start}] (start relative to the sentence). */
T.splitWords = function(s){
  const out = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(s))) out.push({ text: m[0], start: m.index });
  return out;
};

T.countWords = function(text){
  const m = text.match(/\S+/g);
  return m ? m.length : 0;
};

// Tokenization cache (paragraph text -> {sentences:[{text,start,words,wordStart}], wordCount})
const tokCache = new Map();
const TOK_MAX = 600;
T.tokenize = function(paraText){
  let v = tokCache.get(paraText);
  if (v) return v;
  const sentences = T.splitSentences(paraText).map(s => ({ text: s.text, start: s.start, words: T.splitWords(s.text) }));
  let wc = 0;
  for (const s of sentences) { s.wordStart = wc; wc += s.words.length; }
  v = { sentences, wordCount: wc };
  if (tokCache.size >= TOK_MAX) tokCache.delete(tokCache.keys().next().value);
  tokCache.set(paraText, v);
  return v;
};

/** Normalize text for fuzzy matching (OCR vs edition): lowercase, ascii-fold, strip punctuation. */
T.normalize = function(s){
  return String(s || '')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[‘’‚‛`´]/g, "'")
    .replace(/[“”„‟«»]/g, '"')
    .replace(/[‐‑‒–—―]/g, '-')
    .replace(/æ/g, 'ae').replace(/œ/g, 'oe').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9\s'-]/g, ' ')
    .replace(/['-]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
};
T.normWords = s => T.normalize(s).split(' ').filter(Boolean);

// ---- canonical locators: {c: chapter, p: paragraph, s: sentence, w: word} ----
const prefixCache = new WeakMap();
function prefix(ch){
  let a = prefixCache.get(ch);
  if (a) return a;
  if (!ch.pwc || ch.pwc.length !== ch.paras.length) ch.pwc = ch.paras.map(T.countWords);
  a = new Array(ch.paras.length + 1);
  a[0] = 0;
  for (let i = 0; i < ch.paras.length; i++) a[i + 1] = a[i] + ch.pwc[i];
  prefixCache.set(ch, a);
  return a;
}
T.ensureCounts = function(content){
  let total = 0;
  content.chapterOffsets = [];
  for (const ch of content.chapters) {
    content.chapterOffsets.push(total);
    total += prefix(ch)[ch.paras.length];
  }
  content.totalWords = total;
  return content;
};
T.chapterWords = (content, c) => { const ch = content.chapters[c]; return ch ? prefix(ch)[ch.paras.length] : 0; };
T.firstLoc = () => ({ c: 0, p: 0, s: 0, w: 0 });
T.locKey = loc => `${loc.c}.${loc.p}.${loc.s}.${loc.w}`;
T.parseKey = k => { const a = String(k).split('.').map(Number); return { c: a[0] || 0, p: a[1] || 0, s: a[2] || 0, w: a[3] || 0 }; };
T.compare = (a, b) => (a.c - b.c) || (a.p - b.p) || ((a.s || 0) - (b.s || 0)) || ((a.w || 0) - (b.w || 0));
T.sameSentence = (a, b) => a && b && a.c === b.c && a.p === b.p && (a.s || 0) === (b.s || 0);

T.clampLoc = function(content, loc){
  const chs = content.chapters;
  if (!chs.length) return T.firstLoc();
  let c = Math.max(0, Math.min(loc.c || 0, chs.length - 1));
  // skip empty chapters forward
  while (c < chs.length - 1 && !chs[c].paras.length) c++;
  const ch = chs[c];
  if (!ch.paras.length) return { c, p: 0, s: 0, w: 0 };
  const p = Math.max(0, Math.min(loc.p || 0, ch.paras.length - 1));
  const tok = T.tokenize(ch.paras[p]);
  const s = Math.max(0, Math.min(loc.s || 0, Math.max(0, tok.sentences.length - 1)));
  const sent = tok.sentences[s];
  const w = sent ? Math.max(0, Math.min(loc.w || 0, Math.max(0, sent.words.length - 1))) : 0;
  return { c, p, s, w };
};

T.locToGlobal = function(content, loc){
  if (!content.chapterOffsets) T.ensureCounts(content);
  const ch = content.chapters[loc.c];
  if (!ch) return content.totalWords;
  const pre = prefix(ch);
  if (!ch.paras.length) return content.chapterOffsets[loc.c];
  const p = Math.max(0, Math.min(loc.p || 0, ch.paras.length - 1));
  let g = content.chapterOffsets[loc.c] + pre[p];
  const tok = T.tokenize(ch.paras[p]);
  const sent = tok.sentences[Math.min(loc.s || 0, Math.max(0, tok.sentences.length - 1))];
  if (sent) g += sent.wordStart + Math.min(loc.w || 0, Math.max(0, sent.words.length - 1));
  return g;
};

T.globalToLoc = function(content, g){
  if (!content.chapterOffsets) T.ensureCounts(content);
  const chs = content.chapters;
  if (!chs.length) return T.firstLoc();
  g = Math.max(0, Math.min(g, Math.max(0, content.totalWords - 1)));
  let c = 0;
  for (let i = 0; i < chs.length; i++) {
    if (content.chapterOffsets[i] <= g && T.chapterWords(content, i) > 0) c = i;
    if (content.chapterOffsets[i] > g) break;
  }
  const ch = chs[c];
  const pre = prefix(ch);
  let local = g - content.chapterOffsets[c];
  // binary search paragraph
  let lo = 0, hi = ch.paras.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (pre[mid] <= local) lo = mid; else hi = mid - 1; }
  const p = lo;
  local -= pre[p];
  const tok = T.tokenize(ch.paras[p] || '');
  let s = 0;
  for (let i = 0; i < tok.sentences.length; i++) { if (tok.sentences[i].wordStart <= local) s = i; else break; }
  const sent = tok.sentences[s];
  const w = sent ? Math.max(0, Math.min(local - sent.wordStart, sent.words.length - 1)) : 0;
  return { c, p, s, w };
};

T.percent = function(content, loc){
  if (!content.chapterOffsets) T.ensureCounts(content);
  if (!content.totalWords) return 0;
  return Math.min(1, T.locToGlobal(content, loc) / content.totalWords);
};

/** Next sentence locator (crossing paragraphs/chapters), or null at end. */
T.nextSentence = function(content, loc){
  const chs = content.chapters;
  let { c, p, s } = loc;
  let ch = chs[c];
  if (!ch) return null;
  if (ch.paras[p] !== undefined) {
    const tok = T.tokenize(ch.paras[p]);
    if (s + 1 < tok.sentences.length) return { c, p, s: s + 1, w: 0 };
  }
  p += 1;
  while (c < chs.length) {
    ch = chs[c];
    while (p < ch.paras.length) {
      if (T.tokenize(ch.paras[p]).sentences.length) return { c, p, s: 0, w: 0 };
      p++;
    }
    c += 1; p = 0;
  }
  return null;
};
T.prevSentence = function(content, loc){
  const chs = content.chapters;
  let { c, p, s } = loc;
  if (s > 0) return { c, p, s: s - 1, w: 0 };
  p -= 1;
  while (c >= 0) {
    const ch = chs[c];
    while (p >= 0) {
      const tok = T.tokenize(ch.paras[p]);
      if (tok.sentences.length) return { c, p, s: tok.sentences.length - 1, w: 0 };
      p--;
    }
    c -= 1;
    if (c >= 0) p = chs[c].paras.length - 1;
  }
  return null;
};
T.sentenceAt = function(content, loc){
  const ch = content.chapters[loc.c];
  if (!ch || ch.paras[loc.p] === undefined) return null;
  const tok = T.tokenize(ch.paras[loc.p]);
  return tok.sentences[loc.s] || null;
};
T.paragraphStart = loc => ({ c: loc.c, p: loc.p, s: 0, w: 0 });
T.nextParagraph = function(content, loc){
  const chs = content.chapters;
  let { c, p } = loc; p += 1;
  while (c < chs.length) { if (p < chs[c].paras.length) return { c, p, s: 0, w: 0 }; c++; p = 0; }
  return null;
};
T.prevParagraph = function(content, loc){
  const chs = content.chapters;
  let { c, p } = loc; p -= 1;
  while (c >= 0) { if (p >= 0) return { c, p, s: 0, w: 0 }; c--; if (c >= 0) p = chs[c].paras.length - 1; }
  return null;
};

// ---- readability ----
T.syllables = function(word){
  let w = String(word).toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return 0;
  if (w.length <= 3) return 1;
  w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
  const m = w.match(/[aeiouy]{1,2}/g);
  return m ? Math.max(1, m.length) : 1;
};
function round(x, d = 0){ const k = Math.pow(10, d); return Math.round(x * k) / k; }
T.readability = function(content){
  const paras = [];
  for (const ch of content.chapters) for (const p of ch.paras) paras.push(p);
  if (!paras.length) return null;
  const step = Math.max(1, Math.floor(paras.length / 150));
  let words = 0, sentences = 0, syll = 0, dialog = 0, longWords = 0;
  for (let i = 0; i < paras.length && words < 5000; i += step) {
    const tok = T.tokenize(paras[i]);
    for (const s of tok.sentences) {
      sentences++;
      if (/["“”]/.test(s.text)) dialog++;
      for (const w of s.words) { words++; const sy = T.syllables(w.text); syll += sy; if (sy >= 3) longWords++; }
    }
  }
  if (!words || !sentences) return null;
  const wps = words / sentences, spw = syll / words;
  const flesch = 206.835 - 1.015 * wps - 84.6 * spw;
  const grade = 0.39 * wps + 11.8 * spw - 15.59;
  return {
    flesch: round(flesch), grade: round(Math.max(0, grade), 1),
    wordsPerSentence: round(wps, 1), syllablesPerWord: round(spw, 2),
    dialogueShare: round(dialog / sentences, 3), longWordShare: round(longWords / words, 3),
    band: flesch >= 70 ? 'Light' : flesch >= 50 ? 'Moderate' : 'Dense',

};

// ---- plain text parsing (Gutenberg-aware) ----
/** Remove Gutenberg-style _italic_ markers while keeping the words. */
function stripItalics(s){
  return String(s).replace(/_+([^_\n]+?)_+/g, '$1').replace(/(^|\s)_+(?=\S)/g, '$1').replace(/_+(?=\s|$)/g, '');
}
T.stripItalics = stripItalics;
const HEAD_RE = /^(chapter|book|part|canto|letter|section|act|scene|stave|prologue|epilogue|introduction|preface|foreword|afterword|appendix|contents|dedication|volume|conclusion|postscript)\b/i;
const ROMAN_RE = /^[IVXLC]+\.?$/;
const NUM_RE = /^\d{1,3}\.?$/;
function isAllCaps(s){
  const letters = s.replace(/[^A-Za-z]/g, '');
  return letters.length >= 3 && letters === letters.toUpperCase();
}
function classifyBlock(b){
  const rawLines = b.split('\n');
  const lines = rawLines.map(l => l.replace(/\s+$/, '')).filter(l => l.trim().length);
  const trimmed = lines.map(l => l.trim());
  if (!trimmed.length) return null;
  const joined = trimmed.join(' ').replace(/\s+/g, ' ').trim();
  if (/^\[illustration/i.test(joined) && /\]$/.test(joined)) return { kind: 'illustration', text: joined };
  const words = T.countWords(joined);
  // TOC block: several lines that look like chapter entries
  if (trimmed.length >= 3) {
    const tocish = trimmed.filter(l => HEAD_RE.test(l) || /^[IVXLC]+\.?\s/.test(l) || /^\d{1,3}\.?\s/.test(l)).length;
    if (tocish / trimmed.length >= 0.6) return { kind: 'toc', text: joined };
  }
  if (trimmed.length <= 3 && joined.length <= 90 && words <= 12) {
    if (HEAD_RE.test(trimmed[0]) || ROMAN_RE.test(trimmed[0]) || NUM_RE.test(trimmed[0]) || (isAllCaps(joined) && !/[.!?]$/.test(joined))) {
      return { kind: 'heading', text: joined };
    }
  }
  if (trimmed.length >= 2) {
    const short = trimmed.filter(l => l.length < 55).length;
    const avg = trimmed.reduce((a, l) => a + l.length, 0) / trimmed.length;
    const indented = rawLines.filter(l => /^\s{2,}\S/.test(l)).length;
    if ((short / trimmed.length >= 0.75 && avg < 46) || indented / rawLines.length >= 0.6) {
      return { kind: 'verse', text: trimmed.join('\n') };
    }
  }
  return { kind: 'para', text: joined.replace(/\[illustration[^\]]*\]/ig, '').replace(/\s+/g, ' ').trim() };
}
T.classifyBlock = classifyBlock;

T.parsePlainText = function(raw, hints = {}){
  let text = String(raw || '').replace(/\r\n?/g, '\n').replace(/\u00a0/g, ' ').replace(/^\ufeff/, '').replace(/\f/g, '\n\n');
  const meta = { title: hints.title || '', author: hints.author || '', language: hints.language || '' };
  const startM = text.match(/^\*{3}\s*START OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*$/im);
  if (startM) {
    const head = text.slice(0, startM.index);
    const t = head.match(/^Title:\s*(.+)$/m), a = head.match(/^Author:\s*(.+)$/m), l = head.match(/^Language:\s*(.+)$/m);
    if (t && !meta.title) meta.title = t[1].trim();
    if (a && !meta.author) meta.author = a[1].trim();
    if (l && !meta.language) meta.language = l[1].trim();
    text = text.slice(startM.index + startM[0].length);
  }
  const endM = text.match(/^\*{3}\s*END OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*$/im);
  if (endM) text = text.slice(0, endM.index);

  const blocks = text.split(/\n[ \t]*\n+/).map(b => b.replace(/^\n+|\n+$/g, '')).filter(b => b.trim().length);
  const items = blocks.map(classifyBlock).filter(Boolean);

  // collapse runs of >= 3 consecutive headings (a table of contents laid out with blank lines)
  for (let i = 0; i < items.length; i++) {
    if (items[i].kind !== 'heading') continue;
    let j = i;
    while (j < items.length && items[j].kind === 'heading') j++;
    if (j - i >= 4) for (let k = i; k < j; k++) items[k].kind = 'toc';
    i = j;
  }

  const chapters = [];
  let cur = { title: '', paras: [] };
  for (const it of items) {
    if (it.kind === 'illustration' || it.kind === 'toc') continue;
    if (it.kind === 'heading') {
      if (cur.paras.length || cur.title) chapters.push(cur);
      cur = { title: it.text, paras: [] };
      continue;
    }
    if (it.text) cur.paras.push(it.text);
  }
  if (cur.paras.length || cur.title) chapters.push(cur);

  // guess title/author from the front block
  const front = chapters[0];
  if (front && !front.title) {
    const firstWords = front.paras.reduce((a, p) => a + T.countWords(p), 0);
    if (!meta.title && front.paras[0] && front.paras[0].length < 80) meta.title = front.paras[0].replace(/\s+/g, ' ').trim();
    const by = front.paras.find(p => /^by\s+\S/i.test(p) && p.length < 60);
    if (by && !meta.author) meta.author = by.replace(/^by\s+/i, '').trim();
    if (firstWords < 40 && chapters.length > 1) chapters.shift();
    else front.title = 'Front matter';
  }
  // merge empty headings: "BOOK ONE" + "CHAPTER I" -> "BOOK ONE · CHAPTER I"; drop other empty ones
  const merged = [];
  let carry = '';
  for (const ch of chapters) {
    if (!ch.paras.length) {
      if (/^(book|part|volume|act)\b/i.test(ch.title)) carry = carry ? carry + ' · ' + ch.title : ch.title;
      continue;
    }
    if (carry) { ch.title = ch.title ? carry + ' · ' + ch.title : carry; carry = ''; }
    merged.push(ch);
  }
  if (!merged.length && text.trim()) merged.push({ title: meta.title || 'Text', paras: [text.replace(/\s+/g, ' ').trim()] });
  merged.forEach((ch, i) => { if (!ch.title) ch.title = 'Section ' + (i + 1); ch.title = stripItalics(ch.title); ch.paras = ch.paras.map(stripItalics); ch.pwc = ch.paras.map(T.countWords); });
  return { title: meta.title, author: meta.author, language: meta.language, chapters: merged };
};

/** Turn heading-aware paragraph list [{text, heading:boolean}] into chapters (used by EPUB/PDF importers). */
T.chaptersFromBlocks = function(blocks, fallbackTitle){
  const chapters = [];
  let cur = { title: '', paras: [] };
  for (const b of blocks) {
    if (b.heading) {
      if (cur.paras.length || cur.title) chapters.push(cur);
      cur = { title: b.text, paras: [] };
    } else if (b.text && b.text.trim()) cur.paras.push(b.text.trim());
  }
  if (cur.paras.length || cur.title) chapters.push(cur);
  const out = [];
  let carry = '';
  for (const ch of chapters) {
    if (!ch.paras.length) { carry = carry ? carry + ' · ' + ch.title : ch.title; continue; }
    if (carry) { ch.title = ch.title ? carry + ' · ' + ch.title : carry; carry = ''; }
    out.push(ch);
  }
  out.forEach((ch, i) => { if (!ch.title) ch.title = i === 0 ? (fallbackTitle || 'Section 1') : 'Section ' + (i + 1); ch.pwc = ch.paras.map(T.countWords); });
  return out;
};

T.formatDuration = function(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s.toString().padStart(2, '0')}s`;
  return `${s}s`;
};
T.formatMinutes = function(min){
  min = Math.round(min);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
};
T.readingTime = (words, wpm = 230) => words / Math.max(60, wpm); // minutes
})();

</script>
<script>
/* ==== 04_ingest.js ==== */
/* 04_ingest.js — PDF / EPUB / TXT / HTML / photo ingestion, OCR pipeline, metadata */
(function(){
'use strict';
const F = window.F;
const U = F.util, T = F.text, S = F.store, C = F.C;
const I = F.ingest = {};

// ---------- helpers ----------
function titleFromFilename(name){
  return String(name || 'Untitled').replace(/\.[a-z0-9]{1,5}$/i, '').replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim() || 'Untitled';
}
function cleanMetaTitle(t){
  t = String(t || '').trim();
  if (!t || t.length < 2) return '';
  if (/^untitled|^microsoft word|\.(docx?|indd|qxd|pdf|tex|odt)$/i.test(t)) return '';
  return t.replace(/\s+/g, ' ');
}
function parseXML(str){
  const doc = new DOMParser().parseFromString(str, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) return new DOMParser().parseFromString(str, 'text/html');
  return doc;
}
function stripTags(s){ return String(s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }
function dirOf(p){ return p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : ''; }
function resolvePath(base, href){
  if (!href) return base;
  href = decodeURIComponent(href.split('#')[0].split('?')[0]);
  if (href.startsWith('/')) return href.slice(1);
  const parts = (base + href).split('/');
  const out = [];
  for (const p of parts) { if (p === '..') out.pop(); else if (p !== '.' && p !== '') out.push(p); }
  return out.join('/');
}
function normHref(p){ return p.replace(/^\/+/, '').toLowerCase(); }
async function readZipText(zip, path){
  let f = zip.file(path);
  if (!f) { const lower = path.toLowerCase(); const key = Object.keys(zip.files).find(k => k.toLowerCase() === lower); if (key) f = zip.file(key); }
  return f ? f.async('string') : null;
}

function makeBook(meta, content, extra = {}){
  content.chapters = content.chapters.filter(ch => ch && ch.paras && ch.paras.length);
  content.chapters.forEach(ch => { ch.pwc = ch.paras.map(T.countWords); });
  T.ensureCounts(content);
  const title = (meta.title || 'Untitled').replace(/\s+/g, ' ').trim();
  const book = {
    id: U.uuid(), title, author: (meta.author || '').replace(/\s+/g, ' ').trim(), language: (meta.language || '').trim(),
    subjects: U.uniq((meta.subjects || []).map(s => String(s).trim())).slice(0, 12), description: (meta.description || '').trim(),
    source: extra.source || 'upload', sourceRef: extra.sourceRef || null, format: extra.format || 'txt',
    cover: meta.cover || null, coverColor: U.hashColor(title),
    addedAt: Date.now(), updatedAt: Date.now(), lastOpenedAt: null, finishedAt: null,
    words: content.totalWords, chapterCount: content.chapters.length, paragraphs: content.chapters.reduce((a, c) => a + c.paras.length, 0),
    readability: T.readability(content), ocrUsed: !!extra.ocrUsed, pdfPages: extra.pdfPages || null,
    physical: { totalPages: extra.totalPages || null }, fileName: extra.fileName || null, fileSize: extra.fileSize || null,
    ids: extra.ids || {},
  };
  return { book, content: { bookId: book.id, chapters: content.chapters } };
}
I.makeBook = makeBook;

I.save = async ({ book, content }) => {
  content.bookId = book.id;
  await S.put('content', content);
  await S.put('books', book);
  await S.put('progress', { bookId: book.id, loc: T.firstLoc(), percent: 0, updatedAt: Date.now(), physicalPage: null });
  F.bus.emit('books-changed', { bookId: book.id, action: 'added' });
  return book;
};

I.deleteBook = async (bookId) => {
  await S.del('books', bookId);
  await S.del('content', bookId);
  await S.del('progress', bookId);
  await S.del('calibration', bookId);
  try { await S.delWhere('audio', 'bookId', bookId); } catch (e) {}
  try { await S.delWhere('scans', 'bookId', bookId); } catch (e) {}
  // sessions are kept for history but marked orphaned
  F.bus.emit('books-changed', { bookId, action: 'deleted' });
};

I.detectType = file => {
  const name = (file.name || '').toLowerCase();
  const type = file.type || '';
  if (name.endsWith('.pdf') || type === 'application/pdf') return 'pdf';
  if (name.endsWith('.epub') || type === 'application/epub+zip') return 'epub';
  if (/\.(txt|text|md|markdown)$/.test(name) || type.startsWith('text/plain') || type === 'text/markdown') return 'txt';
  if (/\.(x?html?)$/.test(name) || type.includes('html')) return 'html';
  if (type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif|gif|bmp|tiff?)$/.test(name)) return 'image';
  return null;
};

I.fromFile = async (file, opts = {}) => {
  const type = I.detectType(file);
  if (!type) throw new Error(`Unsupported file type: ${file.name}. Use PDF, EPUB, TXT, HTML or images.`);
  if (type === 'pdf') return I.fromPDF(file, opts);
  if (type === 'epub') return I.fromEPUB(file, opts);
  if (type === 'txt') return I.fromText(await U.readAsText(file), { title: titleFromFilename(file.name), fileName: file.name, fileSize: file.size }, opts);
  if (type === 'html') return I.fromHTML(await U.readAsText(file), { title: titleFromFilename(file.name), fileName: file.name, fileSize: file.size }, opts);
  return I.fromImages([file], opts);
};

// ---------- plain text ----------
I.fromText = async (text, hints = {}, opts = {}) => {
  (opts.onProgress || (() => {}))({ stage: 'parsing', message: 'Parsing text…', percent: 0.3 });
  const parsed = T.parsePlainText(text, hints);
  if (!parsed.chapters.length) throw new Error('No readable text found.');
  return makeBook({
    title: parsed.title || hints.title, author: parsed.author || hints.author, language: parsed.language || hints.language,
    subjects: hints.subjects, description: hints.description, cover: hints.cover,
  }, { chapters: parsed.chapters }, { source: hints.source || 'upload', sourceRef: hints.sourceRef, format: 'txt', fileName: hints.fileName, fileSize: hints.fileSize, ids: hints.ids });
};

// ---------- HTML ----------
const BLOCK_TAGS = new Set(['p', 'div', 'section', 'article', 'blockquote', 'li', 'ul', 'ol', 'dl', 'dd', 'dt', 'pre', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'table', 'tbody', 'thead', 'tr', 'td', 'th', 'figure', 'figcaption', 'header', 'footer', 'main', 'aside', 'hr', 'address', 'center', 'body', 'nav', 'details', 'summary']);
I.blocksFromHTML = function(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,noscript,svg,math,template,iframe,object').forEach(n => n.remove());
  const blocks = [];
  let buf = '';
  const flush = () => {
    const t = buf.replace(/[ \t]*\n[ \t]*/g, '\n').replace(/ {2,}/g, ' ').replace(/\n{2,}/g, '\n').trim();
    if (t) blocks.push({ text: t, heading: false });
    buf = '';
  };
  const walk = node => {
    if (node.nodeType === 3) { buf += node.nodeValue.replace(/\s+/g, ' '); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'br') { buf += '\n'; return; }
    if (tag === 'img' || tag === 'image' || tag === 'video' || tag === 'audio' || tag === 'canvas') return;
    if (/^h[1-6]$/.test(tag)) {
      flush();
      const t = node.textContent.replace(/\s+/g, ' ').trim();
      if (t) blocks.push({ text: t, heading: true, level: +tag[1] });
      return;
    }
    if (tag === 'pre') {
      flush();
      const t = node.textContent.replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim();
      if (t) blocks.push({ text: t, heading: false, pre: true });
      return;
    }
    const isBlock = BLOCK_TAGS.has(tag);
    if (isBlock) flush();
    for (const ch of Array.from(node.childNodes)) walk(ch);
    if (isBlock) flush();
  };
  walk(doc.body || doc.documentElement);
  flush();
  return blocks.filter(b => /[\p{L}\p{N}]/u.test(b.text));
};

I.fromHTML = async (html, hints = {}, opts = {}) => {
  const blocks = I.blocksFromHTML(html);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const title = (doc.querySelector('title') && doc.querySelector('title').textContent.trim()) || hints.title;
  const authorMeta = doc.querySelector('meta[name="author"]');
  const norm = blocks.map(b => ({ text: b.text, heading: !!b.heading && (b.level || 1) <= 2 }));
  const chapters = T.chaptersFromBlocks(norm, title);
  if (!chapters.length) throw new Error('No readable text found in this HTML file.');
  return makeBook({ title, author: hints.author || (authorMeta && authorMeta.content) || '', language: (doc.documentElement.getAttribute('lang') || '').slice(0, 5), subjects: hints.subjects }, { chapters }, { source: hints.source || 'upload', sourceRef: hints.sourceRef, format: 'html', fileName: hints.fileName, fileSize: hints.fileSize });
};

// ---------- EPUB ----------
I.fromEPUB = async (file, opts = {}) => {
  const onProgress = opts.onProgress || (() => {});
  onProgress({ stage: 'loading', message: 'Opening EPUB…', percent: 0.02 });
  await U.loadScript(C.CDN.JSZIP);
  const zip = await window.JSZip.loadAsync(await U.readAsArrayBuffer(file));
  let opfPath = null;
  const containerXml = await readZipText(zip, 'META-INF/container.xml');
  if (containerXml) {
    const cdoc = parseXML(containerXml);
    const rf = cdoc.getElementsByTagName('rootfile')[0];
    if (rf) opfPath = rf.getAttribute('full-path');
  }
  if (!opfPath) opfPath = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.opf'));
  if (!opfPath) throw new Error('This EPUB has no package file (content.opf).');
  const opfXml = await readZipText(zip, opfPath);
  const opf = parseXML(opfXml);
  const base = dirOf(opfPath);

  const meta = { title: '', author: '', language: '', subjects: [], description: '', cover: null };
  const metaEl = opf.getElementsByTagName('metadata')[0] || opf.documentElement;
  for (const el of Array.from(metaEl.children || [])) {
    const ln = el.localName; const txt = (el.textContent || '').trim();
    if (!txt) continue;
    if (ln === 'title' && !meta.title) meta.title = txt;
    else if (ln === 'creator') meta.author = meta.author ? `${meta.author}, ${txt}` : txt;
    else if (ln === 'language' && !meta.language) meta.language = txt;
    else if (ln === 'subject') meta.subjects.push(txt);
    else if (ln === 'description') meta.description = stripTags(txt);
  }
  const manifest = {};
  for (const it of Array.from(opf.getElementsByTagName('item'))) {
    manifest[it.getAttribute('id')] = { id: it.getAttribute('id'), href: it.getAttribute('href') || '', type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' };
  }
  const spineEl = opf.getElementsByTagName('spine')[0];
  const spine = spineEl ? Array.from(spineEl.getElementsByTagName('itemref')).map(r => r.getAttribute('idref')) : Object.keys(manifest);

  // cover
  let coverId = null;
  const coverMeta = Array.from(opf.getElementsByTagName('meta')).find(m => (m.getAttribute('name') || '') === 'cover');
  if (coverMeta) coverId = coverMeta.getAttribute('content');
  if (!coverId || !manifest[coverId]) coverId = Object.keys(manifest).find(id => manifest[id].props.split(/\s+/).includes('cover-image'));
  if (!coverId) coverId = Object.keys(manifest).find(id => manifest[id].type.startsWith('image/') && /cover/i.test(id + ' ' + manifest[id].href));
  if (coverId && manifest[coverId]) {
    try {
      const f = zip.file(resolvePath(base, manifest[coverId].href));
      if (f) meta.cover = await U.resizeToDataURL(await f.async('blob'), 640, 0.82);
    } catch (e) { console.warn('cover failed', e); }
  }

  // table of contents: href -> title
  const toc = {};
  const navId = Object.keys(manifest).find(id => manifest[id].props.split(/\s+/).includes('nav'));
  if (navId) {
    const navPath = resolvePath(base, manifest[navId].href);
    const html = await readZipText(zip, navPath);
    if (html) {
      const ndoc = new DOMParser().parseFromString(html, 'text/html');
      const navs = Array.from(ndoc.querySelectorAll('nav'));
      const nav = navs.find(n => ((n.getAttribute('epub:type') || n.getAttribute('type') || n.getAttribute('role') || '')).includes('toc')) || navs[0];
      if (nav) for (const a of Array.from(nav.querySelectorAll('a[href]'))) {
        const href = normHref(resolvePath(dirOf(navPath), a.getAttribute('href')));
        if (!toc[href]) toc[href] = a.textContent.replace(/\s+/g, ' ').trim();
      }
    }
  }
  if (!Object.keys(toc).length) {
    const ncxId = spineEl && spineEl.getAttribute('toc');
    const ncxItem = (ncxId && manifest[ncxId]) || Object.values(manifest).find(m => m.type.includes('dtbncx') || /\.ncx$/i.test(m.href));
    if (ncxItem) {
      const ncxPath = resolvePath(base, ncxItem.href);
      const xml = await readZipText(zip, ncxPath);
      if (xml) {
        const ndoc = parseXML(xml);
        for (const np of Array.from(ndoc.getElementsByTagName('navPoint'))) {
          const lbl = np.getElementsByTagName('text')[0], cont = np.getElementsByTagName('content')[0];
          if (lbl && cont) { const href = normHref(resolvePath(dirOf(ncxPath), cont.getAttribute('src'))); if (!toc[href]) toc[href] = lbl.textContent.replace(/\s+/g, ' ').trim(); }
        }
      }
    }
  }

  // spine documents
  const chapters = [];
  let idx = 0;
  for (const idref of spine) {
    idx++;
    const item = manifest[idref];
    if (!item) continue;
    if (item.props.split(/\s+/).includes('nav')) continue;
    if (!/xhtml|html|xml/i.test(item.type) && !/\.x?html?$/i.test(item.href)) continue;
    const path = resolvePath(base, item.href);
    const html = await readZipText(zip, path);
    if (!html) continue;
    onProgress({ stage: 'parsing', message: `Reading section ${idx} of ${spine.length}`, percent: 0.05 + 0.9 * idx / spine.length });
    const blocks = I.blocksFromHTML(html);
    const words = blocks.reduce((a, b) => a + T.countWords(b.text), 0);
    if (words < 5) continue;
    const tocTitle = toc[normHref(path)] || '';
    const topHeads = blocks.filter(b => b.heading && (b.level || 1) <= 2);
    let chs;
    if (topHeads.length >= 2 && words > 2500) {
      chs = T.chaptersFromBlocks(blocks.map(b => ({ text: b.text, heading: !!b.heading && (b.level || 1) <= 2 })), tocTitle);
    } else {
      const firstHead = blocks.find(b => b.heading);
      const paras = blocks.filter(b => b !== firstHead).map(b => b.text);
      let title = tocTitle || (firstHead ? firstHead.text : '');
      chs = [{ title, paras }];
    }
    chs = chs.filter(c => c.paras.length);
    chs.forEach(c => { if (!c.title) c.title = tocTitle || `Section ${chapters.length + 1}`; });
    chapters.push(...chs);
    if (idx % 4 === 0) await U.sleep(0);
  }
  if (!chapters.length) throw new Error('No readable text found in this EPUB.');
  const title = meta.title || titleFromFilename(file.name);
  return makeBook(Object.assign(meta, { title }), { chapters }, { source: 'upload', format: 'epub', fileName: file.name, fileSize: file.size });
};

// ---------- PDF ----------
I.pdfjs = async () => {
  await U.loadScript(C.CDN.PDFJS);
  const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
  if (!lib) throw new Error('PDF engine failed to load.');
  lib.GlobalWorkerOptions.workerSrc = C.CDN.PDFJS_WORKER;
  return lib;
};

function linesFromTextContent(tc){
  const items = (tc.items || []).filter(it => it.str && it.str.trim().length && it.transform);
  if (!items.length) return [];
  const its = items.map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5], h: Math.abs(it.transform[3]) || it.height || 10, w: it.width || 0 }));
  its.sort((a, b) => (b.y - a.y) || (a.x - b.x));
  const lines = [];
  for (const it of its) {
    const last = lines[lines.length - 1];
    if (last && Math.abs(last.y - it.y) < Math.max(2, Math.min(last.h, it.h) * 0.6)) {
      const gap = it.x - last.xEnd;
      const needSpace = gap > last.h * 0.12 && !last.text.endsWith(' ') && !it.str.startsWith(' ');
      last.text += (needSpace ? ' ' : '') + it.str;
      last.xEnd = Math.max(last.xEnd, it.x + it.w);
      last.h = Math.max(last.h, it.h);
    } else lines.push({ text: it.str, x: it.x, xEnd: it.x + it.w, y: it.y, h: it.h });
  }
  return lines.map(l => Object.assign(l, { text: l.text.replace(/\s+/g, ' ').trim() })).filter(l => l.text);
}
function median(arr){ if (!arr.length) return 0; const a = arr.slice().sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; }
function normLineKey(t){ return t.toLowerCase().replace(/\d+/g, '#').replace(/[^a-z#]+/g, ''); }

function stripRepeatedLines(pages){
  const textPages = pages.filter(p => p.lines && p.lines.length);
  if (textPages.length < 3) return;
  const counts = new Map();
  for (const p of textPages) {
    const edge = [...p.lines.slice(0, 2), ...p.lines.slice(-2)];
    const seen = new Set();
    for (const l of edge) { const k = normLineKey(l.text); if (k.length < 2 || seen.has(k)) continue; seen.add(k); counts.set(k, (counts.get(k) || 0) + 1); }
  }
  const threshold = Math.max(3, Math.ceil(textPages.length * 0.3));
  const repeated = new Set(Array.from(counts.entries()).filter(([, n]) => n >= threshold).map(([k]) => k));
  for (const p of textPages) {
    const n = p.lines.length;
    p.lines = p.lines.filter((l, i) => {
      const edge = i < 2 || i >= n - 2;
      if (!edge) return true;
      if (/^[\divxlc]{1,6}$/i.test(l.text.replace(/\s/g, ''))) return false; // bare page numbers
      return !repeated.has(normLineKey(l.text));
    });
  }
}

function paragraphsFromLines(lines, bodyH){
  if (!lines.length) return [];
  const out = [];
  let cur = null, prev = null;
  const leftX = Math.min(...lines.map(l => l.x));
  const maxW = Math.max(...lines.map(l => l.xEnd - l.x));
  for (const l of lines) {
    const words = T.countWords(l.text);
    const isHeading = bodyH && l.h > bodyH * 1.22 && words <= 14 && !/[,;:]$/.test(l.text) && !(/[a-z]\.$/.test(l.text) && words > 8);
    if (isHeading) { if (cur) { out.push(cur); cur = null; } out.push({ text: l.text, heading: true }); prev = l; continue; }
    let newPara = !cur;
    if (cur && prev) {
      const gap = prev.y - l.y;
      const indent = (l.x - leftX) > bodyH * 0.9 && (prev.x - leftX) < bodyH * 0.9;
      const prevShort = (prev.xEnd - prev.x) < maxW * 0.75 && /[.!?…"”’')\]]$/.test(prev.text);
      if (gap > bodyH * 1.7 || indent || prevShort) newPara = true;
    }
    if (newPara) { if (cur) out.push(cur); cur = { text: l.text, heading: false }; }
    else if (/[A-Za-z]-$/.test(cur.text) && /^[a-z]/.test(l.text)) cur.text = cur.text.slice(0, -1) + l.text;
    else cur.text += ' ' + l.text;
    prev = l;
  }
  if (cur) out.push(cur);
  return out;
}

async function renderPage(page, targetWidth){
  const vp1 = page.getViewport({ scale: 1 });
  const scale = Math.min(4, Math.max(1, targetWidth / vp1.width));
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

async function resolveOutline(doc, items, depth = 0){
  const out = [];
  for (const it of items || []) {
    let pageIndex = null;
    try {
      let dest = it.dest;
      if (typeof dest === 'string') dest = await doc.getDestination(dest);
      if (Array.isArray(dest) && dest.length) pageIndex = (typeof dest[0] === 'object' && dest[0] !== null) ? await doc.getPageIndex(dest[0]) : (typeof dest[0] === 'number' ? dest[0] : null);
    } catch (e) {}
    if (pageIndex !== null && pageIndex !== undefined) out.push({ title: (it.title || '').replace(/\s+/g, ' ').trim(), page: pageIndex + 1 });
    if (depth < 1 && it.items && it.items.length) out.push(...await resolveOutline(doc, it.items, depth + 1));
  }
  out.sort((a, b) => a.page - b.page);
  const seen = new Set();
  return out.filter(o => { if (!o.title || seen.has(o.page)) return false; seen.add(o.page); return true; });
}

function finishChapter(ch, out){ if (ch && ch.paras.length) out.push(ch); }
function newChapter(title){ return { title, paras: [], pg: [] }; }
function pushPara(ch, b){ ch.paras.push(b.text); ch.pg.push(b.page || null); }

function chaptersFromOutline(blocks, outline){
  const out = [];
  let k = 0;
  let cur = newChapter('Front matter');
  for (const b of blocks) {
    while (k < outline.length && b.page >= outline[k].page) {
      finishChapter(cur, out);
      cur = newChapter(outline[k].title);
      k++;
    }
    if (b.heading) { if (T.normalize(b.text) === T.normalize(cur.title) || (cur.paras.length === 0 && T.normalize(cur.title).includes(T.normalize(b.text)))) continue; }
    pushPara(cur, b);
  }
  finishChapter(cur, out);
  return out;
}
function chaptersFromHeadingBlocks(blocks, fallbackTitle){
  const out = [];
  let cur = newChapter(fallbackTitle || 'Front matter');
  for (const b of blocks) {
    if (b.heading) {
      if (cur.paras.length) { finishChapter(cur, out); cur = newChapter(b.text); }
      else cur.title = cur.paras.length === 0 && cur.title && cur.title !== fallbackTitle && cur.title !== 'Front matter' ? `${cur.title} · ${b.text}` : b.text;
      continue;
    }
    pushPara(cur, b);
  }
  finishChapter(cur, out);
  return out;
}
function chaptersByPages(blocks, numPages, title){
  if (numPages <= 40) { const ch = newChapter(title || 'Full text'); blocks.forEach(b => { if (!b.heading) pushPara(ch, b); else pushPara(ch, b); }); return [ch]; }
  const out = [];
  const span = 20;
  let cur = null;
  for (const b of blocks) {
    const bucket = Math.floor(((b.page || 1) - 1) / span);
    if (!cur || cur.bucket !== bucket) { finishChapter(cur, out); cur = newChapter(`Pages ${bucket * span + 1}–${Math.min(numPages, (bucket + 1) * span)}`); cur.bucket = bucket; }
    pushPara(cur, b);
  }
  finishChapter(cur, out);
  out.forEach(c => delete c.bucket);
  return out;
}
function mergeAcrossPages(blocks){
  for (let i = 0; i < blocks.length - 1; i++) {
    const a = blocks[i], b = blocks[i + 1];
    if (a.heading || b.heading) continue;
    if (a.page && b.page && b.page === a.page + 1 && !/[.!?…"”’')\]:]$/.test(a.text) && /^[a-z(“"‘']/.test(b.text)) {
      if (/[A-Za-z]-$/.test(a.text) && /^[a-z]/.test(b.text)) a.text = a.text.slice(0, -1) + b.text; else a.text += ' ' + b.text;
      blocks.splice(i + 1, 1); i--;
    }
  }
}

I.fromPDF = async (file, opts = {}) => {
  const onProgress = opts.onProgress || (() => {});
  onProgress({ stage: 'loading', message: 'Opening PDF…', percent: 0.01 });
  const pdfjs = await I.pdfjs();
  const data = new Uint8Array(await U.readAsArrayBuffer(file));
  const doc = await pdfjs.getDocument({ data, isEvalSupported: false }).promise;
  const numPages = doc.numPages;
  let info = {};
  try { info = (await doc.getMetadata()).info || {}; } catch (e) {}
  const meta = {
    title: cleanMetaTitle(info.Title) || titleFromFilename(file.name),
    author: cleanMetaTitle(info.Author) || '',
    subjects: info.Keywords ? String(info.Keywords).split(/[,;]/).map(s => s.trim()).filter(Boolean).slice(0, 8) : [],
  };
  let outline = [];
  try { const ol = await doc.getOutline(); if (ol && ol.length) outline = await resolveOutline(doc, ol); } catch (e) {}

  const ocrEnabled = opts.ocr !== false && S.settings.get('ocrAuto', true);
  const ocrLang = S.settings.get('ocrLang', 'eng');
  const pages = [];
  let ocrUsed = false, ocrFailures = 0;
  for (let i = 1; i <= numPages; i++) {
    if (opts.signal && opts.signal.aborted) throw new Error('Import cancelled.');
    onProgress({ stage: 'parsing', message: `Reading page ${i} of ${numPages}`, percent: 0.02 + 0.9 * (i - 1) / numPages, page: i, pages: numPages });
    const page = await doc.getPage(i);
    let lines = [], ocrBlocks = null;
    try { lines = linesFromTextContent(await page.getTextContent()); } catch (e) { console.warn('text layer failed p', i, e); }
    const chars = lines.reduce((a, l) => a + l.text.length, 0);
    if (chars < 40 && ocrEnabled && ocrFailures < 3) {
      onProgress({ stage: 'ocr', message: `Recognizing text on page ${i} of ${numPages}`, percent: 0.02 + 0.9 * (i - 1) / numPages, page: i, pages: numPages });
      try {
        const canvas = await renderPage(page, 1800);
        const text = await I.ocrCanvas(canvas, { lang: ocrLang, onProgress: p => onProgress({ stage: 'ocr', message: `Recognizing page ${i} of ${numPages} · ${Math.round(p * 100)}%`, percent: 0.02 + 0.9 * (i - 1 + p) / numPages, page: i, pages: numPages }) });
        ocrBlocks = I.ocrTextToParagraphs(text);
        if (ocrBlocks.length) ocrUsed = true;
      } catch (e) { ocrFailures++; console.warn('OCR failed on page', i, e); if (ocrFailures >= 3) onProgress({ stage: 'warn', message: 'OCR is not available; continuing with text layer only.' }); }
    }
    pages.push({ index: i, lines, ocrBlocks });
    try { page.cleanup(); } catch (e) {}
    if (i % 5 === 0) await U.sleep(0);
  }
  stripRepeatedLines(pages);
  const bodyH = median(pages.flatMap(p => (p.lines || []).map(l => l.h)));
  const blocks = [];
  for (const pg of pages) {
    if (pg.ocrBlocks) pg.ocrBlocks.forEach(t => blocks.push({ text: t, heading: false, page: pg.index }));
    else paragraphsFromLines(pg.lines, bodyH).forEach(b => blocks.push(Object.assign(b, { page: pg.index })));
  }
  mergeAcrossPages(blocks);
  let chapters;
  const headCount = blocks.filter(b => b.heading).length;
  if (outline.length >= 2) chapters = chaptersFromOutline(blocks, outline);
  else if (headCount >= 2 && headCount <= Math.max(6, numPages * 1.5)) chapters = chaptersFromHeadingBlocks(blocks, 'Front matter');
  else chapters = chaptersByPages(blocks, numPages, meta.title);
  chapters = chapters.filter(c => c.paras.length);
  if (!chapters.length) throw new Error(ocrEnabled ? 'No text could be extracted from this PDF.' : 'No text layer found. Turn on automatic OCR in Settings to read scanned PDFs.');
  onProgress({ stage: 'saving', message: 'Finishing…', percent: 0.97 });
  try { doc.destroy(); } catch (e) {}
  return makeBook(meta, { chapters }, { source: 'upload', format: 'pdf', fileName: file.name, fileSize: file.size, ocrUsed, pdfPages: numPages });
};

// ---------- OCR ----------
let tessWorker = null, tessLang = null, tessLoading = null, tessProgress = null;
I.getOCRWorker = async (lang = 'eng') => {
  if (tessWorker && tessLang === lang) return tessWorker;
  if (tessLoading) { await tessLoading; if (tessWorker && tessLang === lang) return tessWorker; }
  tessLoading = (async () => {
    await U.loadScript(C.CDN.TESSERACT);
    if (tessWorker) { try { await tessWorker.terminate(); } catch (e) {} tessWorker = null; }
    const w = await window.Tesseract.createWorker(lang, 1, {
      logger: m => { if (tessProgress && m && m.status === 'recognizing text' && typeof m.progress === 'number') tessProgress(m.progress); },
    });
    tessWorker = w; tessLang = lang;
    return w;
  })();
  try { return await tessLoading; } finally { tessLoading = null; }
};
I.releaseOCR = async () => { if (tessWorker) { try { await tessWorker.terminate(); } catch (e) {} tessWorker = null; tessLang = null; } };

function preprocessForOCR(canvas){
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const { width: w, height: h } = canvas;
  let img;
  try { img = ctx.getImageData(0, 0, w, h); } catch (e) { return canvas; }
  const d = img.data;
  const hist = new Uint32Array(256);
  const gray = new Uint8ClampedArray(w * h);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) { const g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000; gray[j] = g; hist[g | 0]++; }
  const total = w * h;
  let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * 0.02) { lo = i; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > total * 0.02) { hi = i; break; } }
  const range = Math.max(1, hi - lo);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) { const v = U.clamp(((gray[j] - lo) / range) * 255, 0, 255); d[i] = d[i + 1] = d[i + 2] = v; }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

I.ocrTextToParagraphs = function(text){
  const t = String(text || '').replace(/\r/g, '').replace(/-\n([a-z])/g, '$1').replace(/[ \t]+\n/g, '\n');
  const isCapsHeader = l => { const letters = l.replace(/[^A-Za-z]/g, ''); return letters.length >= 3 && letters === letters.toUpperCase() && T.countWords(l) <= 12; };
  const out = [];
  for (const block of t.split(/\n\s*\n/)) {
    const lines = block.split('\n').map(l => l.trim()).filter(l => /[\p{L}\p{N}]{2,}/u.test(l) || l.length > 6);
    let body = [];
    for (const line of lines) {
      if (/^[\divxlc]{1,5}$/i.test(line)) continue;                       // bare page number
      if (isCapsHeader(line) && !body.length) { out.push(line.replace(/\s+\d{1,4}$/, '')); continue; } // running header / chapter line on its own
      body.push(line);
    }
    const para = body.join(' ').replace(/\s+/g, ' ').trim();
    if (para) out.push(para);
  }
  return out.filter(p => T.countWords(p) >= 2 || isCapsHeader(p));
};

I.ocrCanvas = async (canvas, { lang = 'eng', onProgress } = {}) => {
  const engine = S.settings.get('ocrEngine', 'tesseract');
  if (engine === 'openai' && S.settings.get('openaiKey')) return I.ocrWithOpenAI(canvas, onProgress);
  const worker = await I.getOCRWorker(lang);
  tessProgress = onProgress || null;
  try {
    const prepped = preprocessForOCR(canvas);
    const { data } = await worker.recognize(prepped);
    return data.text || '';
  } finally { tessProgress = null; }
};

I.ocrWithOpenAI = async (canvas, onProgress) => {
  const key = S.settings.get('openaiKey');
  if (!key) throw new Error('Add an OpenAI key in Settings to use vision OCR.');
  onProgress && onProgress(0.2);
  const dataURL = canvas.toDataURL('image/jpeg', 0.85);
  const model = S.settings.get('openaiVisionModel', 'gpt-4o-mini');
  const body = {
    model, max_tokens: 4000, temperature: 0,
    messages: [{ role: 'user', content: [
      { type: 'text', text: 'Transcribe all the printed text in this image exactly as written, preserving paragraph breaks as blank lines. Ignore page headers, footers and page numbers. Output only the transcribed text.' },
      { type: 'image_url', image_url: { url: dataURL, detail: 'high' } },
    ] }],
  };
  const res = await U.fetchJSON('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}` }, body: JSON.stringify(body) }, 90000);
  onProgress && onProgress(1);
  return (res.choices && res.choices[0] && res.choices[0].message && res.choices[0].message.content) || '';
};

I.ocrImageFile = async (file, { onProgress } = {}) => {
  const canvas = await U.imageToCanvas(file, 2200);
  const text = await I.ocrCanvas(canvas, { lang: S.settings.get('ocrLang', 'eng'), onProgress });
  return { text, paragraphs: I.ocrTextToParagraphs(text), thumb: (await U.imageToCanvas(file, 320)).toDataURL('image/jpeg', 0.7) };
};

I.fromImages = async (files, opts = {}) => {
  const onProgress = opts.onProgress || (() => {});
  const paras = [];
  let i = 0;
  for (const f of files) {
    i++;
    onProgress({ stage: 'ocr', message: `Recognizing photo ${i} of ${files.length}`, percent: (i - 1) / files.length });
    const r = await I.ocrImageFile(f, { onProgress: p => onProgress({ stage: 'ocr', message: `Recognizing photo ${i} of ${files.length} · ${Math.round(p * 100)}%`, percent: (i - 1 + p) / files.length }) });
    paras.push(...r.paragraphs);
  }
  if (!paras.length) throw new Error('No text was recognized. Try more light, a flatter page, and fill the frame with the text.');
  const title = opts.title || `Scanned pages · ${new Date().toLocaleDateString()}`;
  return makeBook({ title, author: opts.author || '' }, { chapters: [{ title: 'Scanned pages', paras }] }, { source: 'photo', format: 'scan', ocrUsed: true });
};

I.appendImagesToBook = async (bookId, files, opts = {}) => {
  const onProgress = opts.onProgress || (() => {});
  const content = await S.get('content', bookId);
  const book = await S.get('books', bookId);
  if (!content || !book) throw new Error('Book not found.');
  const added = [];
  let i = 0;
  for (const f of files) {
    i++;
    onProgress({ stage: 'ocr', message: `Recognizing photo ${i} of ${files.length}`, percent: (i - 1) / files.length });
    const r = await I.ocrImageFile(f, { onProgress: p => onProgress({ stage: 'ocr', message: `Recognizing photo ${i} of ${files.length} · ${Math.round(p * 100)}%`, percent: (i - 1 + p) / files.length }) });
    added.push(...r.paragraphs);
  }
  if (!added.length) throw new Error('No text was recognized in the new photo(s).');
  const last = content.chapters[content.chapters.length - 1] || (content.chapters.push({ title: 'Scanned pages', paras: [] }), content.chapters[content.chapters.length - 1]);
  last.paras.push(...added);
  last.pwc = last.paras.map(T.countWords);
  delete content.chapterOffsets;
  T.ensureCounts(content);
  book.words = content.totalWords; book.paragraphs = content.chapters.reduce((a, c) => a + c.paras.length, 0); book.updatedAt = Date.now(); book.readability = T.readability(content);
  await S.put('content', content);
  await S.put('books', book);
  if (F.calib) F.calib.invalidate(bookId);
  F.bus.emit('books-changed', { bookId, action: 'updated' });
  return added.length;
};

// ---------- metadata edits ----------
I.updateBook = async (bookId, patch) => {
  const book = await S.get('books', bookId);
  if (!book) throw new Error('Book not found.');
  Object.assign(book, patch, { updatedAt: Date.now() });
  if (patch.title) book.coverColor = book.coverColor || U.hashColor(patch.title);
  await S.put('books', book);
  F.bus.emit('books-changed', { bookId, action: 'updated' });
  return book;
};
})();
