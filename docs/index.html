<script>
/* ==== 05_catalog.js ==== */
/* 05_catalog.js — public-domain catalog search (Open Library, Internet Archive, Google Books, Gutendex), full-text import, enrichment, recommendations */
(function(){
'use strict';
const F = window.F;
const U = F.util, T = F.text, S = F.store;
const CAT = F.catalog = {};

const OL_FIELDS = 'key,title,author_name,first_publish_year,subject,cover_i,ia,ebook_access,number_of_pages_median,ratings_average,language,edition_count,public_scan_b';
const SUBJECT_STOP = /accessible book|protected daisy|in library|large type|staff picks|overdrive|wishlist|readalong|open_syllabus|nyt:|bestseller|lending library|specimens|translations into|fiction, general|^fiction$|^general$|juvenile literature|literature$|^english|history and criticism|textbooks|study guides|^reading level|^ficci|^romans?$|comic books|^classic literature$/i;

function strOrFirst(v){ return Array.isArray(v) ? (v[0] || '') : (v || ''); }
function stripTags(s){ return String(s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }
function titleCase(s){ return s.replace(/\w\S*/g, w => w.length > 3 || /^[a-z]/.test(w) ? w[0].toUpperCase() + w.slice(1) : w); }
/** "Austen, Jane, 1775-1817" -> "Jane Austen"; leaves plain names alone. */
CAT.cleanAuthor = function(a){
  return [].concat(a || []).map(s => {
    s = String(s).replace(/,\s*(ed|editor|ill|illustrator|tr|translator|comp|compiler)\.?$/i, '').replace(/,?\s*\(?\b\d{3,4}-(\d{3,4})?\)?\.?$/, '').trim();
    const m = s.match(/^([^,]+),\s*([^,]+)$/);
    return m ? `${m[2].trim()} ${m[1].trim()}` : s;
  }).filter(Boolean).join(', ');
};
CAT.cleanSubjects = function(list){
  const out = [];
  for (let s of [].concat(list || []).flatMap(x => String(x).split(/;|,(?![^()]*\))/))) {
    s = String(s).split(/\s*--\s*/)[0].replace(/\s+/g, ' ').trim();
    if (!s || s.length > 40 || SUBJECT_STOP.test(s) || /\d{4}/.test(s)) continue;
    s = titleCase(s.toLowerCase());
    if (!out.some(x => T.normalize(x) === T.normalize(s))) out.push(s);
    if (out.length >= 12) break;
  }
  return out;
};
CAT.cleanSubjects.one = s => CAT.cleanSubjects([s])[0] || null;

function mapOL(doc){
  return {
    id: 'ol:' + doc.key, source: 'openlibrary', key: doc.key, title: doc.title || 'Untitled', author: (doc.author_name || []).join(', '),
    year: doc.first_publish_year || null, subjects: CAT.cleanSubjects(doc.subject), rawSubjects: doc.subject || [],
    cover: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : null, coverLarge: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg` : null,
    ia: doc.ia || [], ebookAccess: doc.ebook_access || 'no_ebook', pages: doc.number_of_pages_median || null, rating: doc.ratings_average || null,
    languages: doc.language || [], editions: doc.edition_count || 0, publicScan: !!doc.public_scan_b, url: 'https://openlibrary.org' + doc.key,
    fullText: (doc.ebook_access === 'public' && doc.ia && doc.ia.length) ? 'archive' : null,
  };
}

CAT.searchOpenLibrary = async (q, { limit = 20 } = {}) => {
  const d = await U.fetchJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=${limit}&fields=${OL_FIELDS}`, {}, 25000);
  return (d.docs || []).map(mapOL);
};

CAT.searchArchive = async (q, { limit = 20 } = {}) => {
  const query = `(${q}) AND mediatype:texts AND (format:EPUB OR format:DjVuTXT OR format:Text)`;
  const params = new URLSearchParams();
  params.set('q', query); params.set('rows', String(limit)); params.set('output', 'json'); params.append('sort[]', 'downloads desc');
  ['identifier', 'title', 'creator', 'year', 'downloads', 'subject', 'language', 'collection', 'description'].forEach(f => params.append('fl[]', f));
  const d = await U.fetchJSON(`https://archive.org/advancedsearch.php?${params.toString()}`, {}, 25000);
  return ((d.response && d.response.docs) || []).map(doc => {
    const coll = [].concat(doc.collection || []);
    return {
      id: 'ia:' + doc.identifier, source: 'archive', identifier: doc.identifier, title: strOrFirst(doc.title) || doc.identifier, author: CAT.cleanAuthor([].concat(doc.creator || []).slice(0, 2)),
      year: doc.year ? +String(doc.year).slice(0, 4) : null, downloads: doc.downloads || 0, subjects: CAT.cleanSubjects([].concat(doc.subject || []).flatMap(s => String(s).split(';'))),
      cover: `https://archive.org/services/img/${doc.identifier}`, gutenberg: coll.includes('gutenberg'), languages: [].concat(doc.language || []),
      description: (d => (d.length >= 24 && /[a-z]{3}/i.test(d)) ? d : '')(stripTags(strOrFirst(doc.description)).slice(0, 300)), url: `https://archive.org/details/${doc.identifier}`, fullText: 'archive',
    };
  });
};

CAT.searchGutendex = async (q, { limit = 20 } = {}) => {
  const d = await U.fetchJSON(`https://gutendex.com/books/?search=${encodeURIComponent(q)}`, {}, 12000);
  return (d.results || []).slice(0, limit).map(b => ({
    id: 'pg:' + b.id, source: 'gutenberg', gutenbergId: b.id, title: b.title, author: (b.authors || []).map(a => a.name).join(', '),
    subjects: CAT.cleanSubjects((b.subjects || []).concat(b.bookshelves || [])), cover: (b.formats && b.formats['image/jpeg']) || null,
    languages: b.languages || [], downloads: b.download_count || 0, url: `https://www.gutenberg.org/ebooks/${b.id}`, fullText: 'gutenberg',
    year: b.authors && b.authors[0] && b.authors[0].birth_year ? null : null,
  }));
};

CAT.searchGoogleBooks = async (q, { limit = 20 } = {}) => {
  const key = S.settings.get('googleBooksKey');
  const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=${Math.min(40, limit)}&printType=books${key ? '&key=' + encodeURIComponent(key) : ''}`;
  const d = await U.fetchJSON(url, {}, 15000);
  return (d.items || []).map(it => {
    const v = it.volumeInfo || {}, a = it.accessInfo || {};
    return {
      id: 'gb:' + it.id, source: 'google', title: (v.title || 'Untitled') + (v.subtitle ? ': ' + v.subtitle : ''), author: (v.authors || []).join(', '),
      year: v.publishedDate ? +String(v.publishedDate).slice(0, 4) : null, subjects: CAT.cleanSubjects(v.categories || []),
      cover: v.imageLinks ? String(v.imageLinks.thumbnail || v.imageLinks.smallThumbnail || '').replace(/^http:/, 'https:') : null,
      description: stripTags(v.description || '').slice(0, 300), pages: v.pageCount || null, rating: v.averageRating || null,
      publicDomain: !!a.publicDomain, epubLink: (a.epub && a.epub.downloadLink) || null, pdfLink: (a.pdf && a.pdf.downloadLink) || null,
      url: v.infoLink || v.canonicalVolumeLink || null, previewLink: v.previewLink || null, viewability: a.viewability || null,
      fullText: a.publicDomain && (a.epub && a.epub.downloadLink) ? 'google-download' : null,
    };
  });
};

/** Search several sources in parallel. Returns { results, errors, timing }. onPartial(sourceId, results) is called as each finishes. */
CAT.search = async (q, sources, onPartial) => {
  const fns = { openlibrary: CAT.searchOpenLibrary, archive: CAT.searchArchive, gutenberg: CAT.searchGutendex, google: CAT.searchGoogleBooks };
  const errors = {};
  const results = [];
  await Promise.all((sources || Object.keys(fns)).filter(s => fns[s]).map(async s => {
    try { const r = await fns[s](q, { limit: 20 }); results.push(...r); onPartial && onPartial(s, r); }
    catch (e) { errors[s] = (e && e.message) || String(e); onPartial && onPartial(s, null, errors[s]); }
  }));
  return { results, errors };
};

// ---------- import ----------
function fmtBytes(n){ n = +n || 0; if (n > 1e6) return (n / 1e6).toFixed(1) + ' MB'; if (n > 1e3) return Math.round(n / 1e3) + ' KB'; return n + ' B'; }
async function responseText(r){
  const buf = await r.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { try { return new TextDecoder('windows-1252').decode(buf); } catch (e2) { return new TextDecoder().decode(buf); } }
}
function preClean(text){
  // very old Gutenberg files end the license block with *END*THE SMALL PRINT!
  const m = text.match(/\*END\*\s*THE SMALL PRINT[^\n]*\n/i);
  if (m && !/\*{3}\s*START OF/i.test(text)) return text.slice(m.index + m[0].length);
  return text;
}
async function imageToDataURL(url){
  const r = await U.fetchWithTimeout(url, {}, 15000);
  if (!r.ok) throw new Error('cover fetch failed');
  const blob = await r.blob();
  if (!blob.type.startsWith('image/') || blob.size < 500) throw new Error('not an image');
  return U.resizeToDataURL(blob, 640, 0.82);
}
CAT.coverToDataURL = async url => { try { return await imageToDataURL(url); } catch (e) { return null; } };

/** File list + metadata for an Archive item. The JSON metadata API echoes the caller's origin (which fails for
 *  sandboxed "null" origins), so fall back to the item's _files.xml / _meta.xml on the download host, which allows any origin. */
async function archiveFileList(identifier){
  try {
    const meta = await U.fetchJSON(`https://archive.org/metadata/${encodeURIComponent(identifier)}`, {}, 25000);
    if (meta && meta.files && meta.files.length) return { files: meta.files, md: meta.metadata || {} };
  } catch (e) { console.warn('[catalog] metadata API unavailable from this origin, using _files.xml', e && e.message); }
  const base = `https://archive.org/download/${encodeURIComponent(identifier)}/${encodeURIComponent(identifier)}`;
  const [filesXml, metaXml] = await Promise.all([
    U.fetchWithTimeout(base + '_files.xml', {}, 30000).then(r => r.ok ? r.text() : ''),
    U.fetchWithTimeout(base + '_meta.xml', {}, 30000).then(r => r.ok ? r.text() : '').catch(() => ''),
  ]);
  if (!filesXml) throw new Error('Could not read the file list for this Archive item.');
  const fdoc = new DOMParser().parseFromString(filesXml, 'application/xml');
  const files = Array.from(fdoc.getElementsByTagName('file')).map(f => ({
    name: f.getAttribute('name'), format: ((f.getElementsByTagName('format')[0] || {}).textContent) || '', size: ((f.getElementsByTagName('size')[0] || {}).textContent) || '0',
  })).filter(f => f.name);
  const md = {};
  if (metaXml) {
    const mdoc = new DOMParser().parseFromString(metaXml, 'application/xml');
    for (const el of Array.from((mdoc.documentElement && mdoc.documentElement.children) || [])) {
      const k = el.localName, v = (el.textContent || '').trim();
      if (!v) continue;
      md[k] = md[k] === undefined ? v : [].concat(md[k], v);
    }
  }
  return { files, md };
}

CAT.importArchiveItem = async (identifier, onProgress = () => {}, hints = {}) => {
  onProgress({ stage: 'loading', message: 'Fetching file list from the Internet Archive…', percent: 0.02 });
  const { files, md } = await archiveFileList(identifier);
  if (!files.length) throw new Error('This Archive item has no files.');
  const txts = files.filter(f => /\.txt$/i.test(f.name) && !/_djvu\.txt$/i.test(f.name) && !/_meta|_files|_reviews|readme/i.test(f.name) && +f.size > 2000);
  const epubs = files.filter(f => /\.epub$/i.test(f.name));
  const djvu = files.find(f => /_djvu\.txt$/i.test(f.name));
  let pick = null;
  if (txts.length) pick = txts.sort((a, b) => (+b.size || 0) - (+a.size || 0))[0];
  if (!pick && epubs.length) pick = epubs[0];
  if (!pick && djvu) pick = djvu;
  if (!pick) throw new Error('No text or EPUB file is available in this item.');
  onProgress({ stage: 'downloading', message: `Downloading ${pick.name} (${fmtBytes(pick.size)})…`, percent: 0.08 });
  const r = await U.fetchWithTimeout(`https://archive.org/download/${encodeURIComponent(identifier)}/${encodeURIComponent(pick.name)}`, {}, 180000);
  if (!r.ok) throw new Error(`Download failed (HTTP ${r.status}).`);
  const subjects = CAT.cleanSubjects([].concat(md.subject || []).flatMap(s => String(s).split(';')));
  const base = {
    title: hints.title || strOrFirst(md.title), author: CAT.cleanAuthor(hints.author || [].concat(md.creator || []).slice(0, 2)), language: strOrFirst(md.language),
    subjects: hints.subjects && hints.subjects.length ? hints.subjects : subjects, description: stripTags(strOrFirst(md.description)).slice(0, 600),
    source: 'archive', sourceRef: `https://archive.org/details/${identifier}`, ids: { ia: identifier },
  };
  const coverUrl = hints.cover || `https://archive.org/services/img/${identifier}`;
  let res;
  if (/\.epub$/i.test(pick.name)) {
    const blob = await r.blob();
    const file = new File([blob], pick.name, { type: 'application/epub+zip' });
    res = await F.ingest.fromEPUB(file, { onProgress });
    Object.assign(res.book, { source: 'archive', sourceRef: base.sourceRef, ids: base.ids });
    if (!res.book.subjects.length) res.book.subjects = base.subjects;
    if (!res.book.description) res.book.description = base.description;
  } else {
    onProgress({ stage: 'parsing', message: 'Parsing text…', percent: 0.6 });
    const text = preClean(await responseText(r));
    const isDjvu = /_djvu\.txt$/i.test(pick.name);
    res = await F.ingest.fromText(text, Object.assign({}, base, { fileName: pick.name }), { onProgress });
    if (isDjvu) res.book.ocrUsed = true;
  }
  if (!res.book.cover) { const c = await CAT.coverToDataURL(coverUrl); if (c) res.book.cover = c; else res.book.coverUrl = coverUrl; }
  return res;
};

CAT.importGutenberg = async (gutenbergId, onProgress = () => {}, hints = {}) => {
  onProgress({ stage: 'loading', message: 'Looking up the Internet Archive mirror…', percent: 0.02 });
  const pad = String(gutenbergId).padStart(5, '0');
  try {
    const d = await U.fetchJSON(`https://archive.org/advancedsearch.php?q=${encodeURIComponent('identifier:*' + pad + 'gut')}&fl[]=identifier&rows=5&output=json`, {}, 25000);
    const docs = (d.response && d.response.docs) || [];
    const exact = docs.find(x => x.identifier.endsWith(pad + 'gut'));
    if (exact) return CAT.importArchiveItem(exact.identifier, onProgress, Object.assign({}, hints, { ids: { gutenberg: gutenbergId } }));
  } catch (e) { console.warn('mirror lookup failed', e); }
  // direct attempt (gutenberg.org does not send CORS headers; this usually fails in browsers)
  try {
    const r = await U.fetchWithTimeout(`https://www.gutenberg.org/cache/epub/${gutenbergId}/pg${gutenbergId}.txt`, {}, 30000);
    if (r.ok) return F.ingest.fromText(await responseText(r), Object.assign({ source: 'gutenberg', sourceRef: `https://www.gutenberg.org/ebooks/${gutenbergId}`, ids: { gutenberg: gutenbergId } }, hints), { onProgress });
  } catch (e) {}
  const err = new Error('This title is not mirrored for direct import. Download the EPUB or TXT from Project Gutenberg, then upload it here.');
  err.link = `https://www.gutenberg.org/ebooks/${gutenbergId}`;
  throw err;
};

CAT.importResult = async (result, onProgress = () => {}) => {
  const hints = { title: result.title, author: result.author, cover: result.coverLarge || result.cover, subjects: result.subjects };
  switch (result.source) {
    case 'archive': return CAT.importArchiveItem(result.identifier, onProgress, hints);
    case 'gutenberg': return CAT.importGutenberg(result.gutenbergId, onProgress, hints);
    case 'openlibrary': {
      if (result.ia && result.ia.length && result.ebookAccess === 'public') return CAT.importArchiveItem(result.ia[0], onProgress, hints);
      const err = new Error(result.ebookAccess === 'borrowable' ? 'This edition can be borrowed on Open Library but not downloaded here. Check the Internet Archive tab for a public-domain copy.' : 'Open Library lists this title for lookup only; no full text is available for import.');
      err.link = result.url; throw err;
    }
    case 'google': {
      const err = new Error(result.fullText ? 'Google Books offers this as a download. Open the link, save the EPUB, then upload it here.' : 'Google Books provides metadata and preview only for this title.');
      err.link = result.epubLink || result.url; throw err;
    }
    default: throw new Error('Unknown source.');
  }
};

// ---------- enrichment ----------
CAT.enrichBook = async (bookId) => {
  const book = await S.get('books', bookId);
  if (!book || book.source === 'photo') return null;
  if ((book.cover || book.coverUrl) && book.subjects.length >= 3 && book.ids && book.ids.olid) return null;
  const params = new URLSearchParams();
  params.set('title', book.title.replace(/[:;(].*$/, '').trim());
  if (book.author) params.set('author', book.author.split(/,|&| and /)[0].trim());
  params.set('limit', '3'); params.set('fields', OL_FIELDS + ',first_sentence');
  let d;
  try { d = await U.fetchJSON(`https://openlibrary.org/search.json?${params.toString()}`, {}, 15000); } catch (e) { return null; }
  const doc = (d.docs || [])[0];
  if (!doc) return null;
  const patch = { ids: Object.assign({}, book.ids || {}, { olid: doc.key }) };
  if (!book.cover && !book.coverUrl && doc.cover_i) {
    const c = await CAT.coverToDataURL(`https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`);
    if (c) patch.cover = c; else patch.coverUrl = `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`;
  }
  const subj = CAT.cleanSubjects(doc.subject);
  if (book.subjects.length < 3 && subj.length) patch.subjects = U.uniq(book.subjects.concat(subj)).slice(0, 12);
  if (doc.first_publish_year && !book.year) patch.year = doc.first_publish_year;
  if (doc.number_of_pages_median) patch.physical = Object.assign({}, book.physical || {}, { pagesHint: doc.number_of_pages_median });
  await F.ingest.updateBook(bookId, patch);
  return patch;
};

// ---------- recommendations ----------
const LANG3 = { en: 'eng', fr: 'fre', de: 'ger', es: 'spa', it: 'ita', pt: 'por', nl: 'dut', ru: 'rus', sv: 'swe', la: 'lat' };
CAT.recommend = async (profile, libraryBooks, { limit = 12 } = {}) => {
  const seeds = (profile.topSubjects || []).slice(0, 4);
  const authors = (profile.topAuthors || []).slice(0, 2);
  if (!seeds.length && !authors.length) return { items: [], note: 'Read a little first. Recommendations build from the subjects and authors of books you actually spend time with.' };
  const owned = new Set(libraryBooks.map(b => T.normalize(b.title)));
  const ownedAuthors = new Set(libraryBooks.map(b => T.normalize(b.author)).filter(Boolean));
  const lang = LANG3[(profile.language || 'en').slice(0, 2)] || null;
  const candidates = new Map();
  const queries = seeds.map(s => ({ type: 'subject', term: s.name, weight: 0.6 + s.weight })).concat(authors.map(a => ({ type: 'author', term: a.name, weight: 1.1 })));
  await Promise.allSettled(queries.map(async q => {
    const params = new URLSearchParams();
    if (q.type === 'subject') { params.set('subject', q.term); params.set('sort', 'rating'); params.set('limit', '20'); }
    else { params.set('author', q.term); params.set('sort', 'rating'); params.set('limit', '15'); }
    if (lang) params.set('language', lang);
    params.set('fields', OL_FIELDS);
    const d = await U.fetchJSON(`https://openlibrary.org/search.json?${params.toString()}`, {}, 25000);
    for (const doc of d.docs || []) {
      const item = candidates.get(doc.key) || { doc, score: 0, reasons: [] };
      item.score += q.weight;
      item.reasons.push(q.type === 'subject' ? `shares “${q.term}” with books you read` : `by ${q.term}, whose work you already read`);
      candidates.set(doc.key, item);
    }
  }));
  const items = [];
  for (const it of candidates.values()) {
    const d = it.doc;
    if (!d.title || owned.has(T.normalize(d.title))) continue;
    const m = mapOL(d);
    const overlap = m.subjects.filter(s => profile.subjectSet && profile.subjectSet.has(T.normalize(s))).length;
    it.score += Math.min(4, overlap) * 0.3;
    if (m.fullText) { it.score += 0.7; it.reasons.push('free full text on the Internet Archive, one tap to import'); }
    if (m.rating) it.score += (m.rating - 3.6) * 0.5;
    if (profile.preferredPages && m.pages) { const ratio = m.pages / profile.preferredPages; if (ratio > 0.6 && ratio < 1.6) { it.score += 0.25; it.reasons.push('about the length you tend to finish'); } }
    if (m.author && ownedAuthors.has(T.normalize(m.author)) && !it.reasons.some(r => r.startsWith('by '))) it.score += 0.3;
    items.push(Object.assign(m, { score: Math.round(it.score * 100) / 100, reasons: U.uniq(it.reasons).slice(0, 3) }));
  }
  items.sort((a, b) => b.score - a.score);
  return { items: items.slice(0, limit) };
};
})();

</script>
<script>
/* ==== 06_tts.js ==== */
/* 06_tts.js — speech providers (browser voices, on-device Kokoro, ElevenLabs, OpenAI, Google Cloud), playback controller, word sync */
(function(){
'use strict';
const F = window.F;
const U = F.util, T = F.text, S = F.store, C = F.C;
const X = F.tts = {};

const state = X.state = {
  status: 'idle',            // idle | loading | playing | paused
  provider: 'browser',       // browser | kokoro | elevenlabs | openai | google
  personaId: 'calm-narrator',
  speed: 1,
  bookId: null,
  loc: null,                 // { c, p, s } current sentence
  word: -1,                  // current word index within the sentence
  sleepMode: 0,              // 0 off, -1 end of chapter, N minutes
  sleepAt: null,
  error: null,
  loadingMsg: '',
};
let book = null, content = null;
let session = 0;            // increments on every stop/seek; async callbacks check it
let currentUtterance = null; // keep a reference (Chrome GC bug)
const emit = () => F.bus.emit('tts', Object.assign({}, state));

const PROVIDERS = {
  browser:    { name: 'Browser voices',   short: 'Browser',   ready: () => browser.available() },
  kokoro:     { name: 'On-device (Kokoro)', short: 'On-device', ready: () => kokoroSupported() },
  elevenlabs: { name: 'ElevenLabs',       short: 'ElevenLabs', ready: () => !!S.settings.get('elevenlabsKey') },
  openai:     { name: 'OpenAI',           short: 'OpenAI',    ready: () => !!S.settings.get('openaiKey') },
  google:     { name: 'Google Cloud',     short: 'Google',    ready: () => !!S.settings.get('googleTtsKey') },
};
X.PROVIDERS = PROVIDERS;
X.providerReady = id => !!(PROVIDERS[id] && PROVIDERS[id].ready());
X.providerName = id => (PROVIDERS[id] || {}).name || id;
X.providerShort = id => (PROVIDERS[id] || {}).short || id;

X.init = () => {
  state.provider = S.settings.get('ttsProvider', 'browser');
  state.personaId = S.settings.get('ttsPersona', 'calm-narrator');
  state.speed = +S.settings.get('ttsSpeed', 1) || 1;
  if (!X.providerReady(state.provider)) state.provider = 'browser';
  if (browser.available()) browser.loadVoices().then(v => { browser.voices = v; F.bus.emit('tts-voices', v); });
  try { if (window.speechSynthesis) speechSynthesis.addEventListener('voiceschanged', () => { browser.voices = speechSynthesis.getVoices(); F.bus.emit('tts-voices', browser.voices); }); } catch (e) {}
};
X.persona = () => C.PERSONAS.find(p => p.id === state.personaId) || C.PERSONAS[0];
X.load = (b, c) => {
  if (book && b && book.id !== b.id) X.stop();
  book = b; content = c;
  state.bookId = b ? b.id : null;
  if (!b) state.loc = null;
};
X.isPlaying = () => state.status === 'playing' || state.status === 'loading';

function fail(msg){
  state.status = 'idle'; state.error = msg; state.loadingMsg = '';
  emit();
  F.bus.emit('tts-error', { message: msg });
}
function setWord(w){
  if (w === state.word) return;
  state.word = w;
  if (state.loc) F.bus.emit('tts-word', { c: state.loc.c, p: state.loc.p, s: state.loc.s, w });
}
function setSentence(loc, w){
  state.loc = { c: loc.c, p: loc.p, s: loc.s };
  state.word = -1;
  F.bus.emit('tts-sentence', { c: loc.c, p: loc.p, s: loc.s, w: w || 0 });
  setWord(w || 0);
}
function wordAtChar(words, absChar){
  let lo = 0, hi = words.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (words[mid].start <= absChar) lo = mid; else hi = mid - 1; }
  return lo;
}
function sleepShouldStop(nextLoc){
  if (state.sleepMode === -1 && state.loc && nextLoc && nextLoc.c !== state.loc.c) return true;
  if (state.sleepAt && Date.now() >= state.sleepAt) return true;
  return false;
}
function finished(){
  state.status = 'idle'; state.loadingMsg = '';
  emit();
  F.bus.emit('tts-ended', { bookId: state.bookId });
}
function sleepStop(){
  X.pause();
  state.sleepMode = 0; state.sleepAt = null;
  emit();
  F.bus.emit('tts-sleep', {});
}
function setLoading(msg){
  if (state.status !== 'loading' && state.status !== 'playing') return;
  if (state.loadingMsg !== msg) { state.loadingMsg = msg; emit(); }
}

// =====================================================================
// Browser speech synthesis
// =====================================================================
const browser = X.browser = {
  voices: [],
  blocked: new Set(),
  available: () => 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  loadVoices(){
    return new Promise(res => {
      const v = speechSynthesis.getVoices();
      if (v && v.length) return res(v);
      let done = false;
      const h = () => { if (done) return; done = true; res(speechSynthesis.getVoices() || []); };
      try { speechSynthesis.addEventListener('voiceschanged', h, { once: true }); } catch (e) {}
      setTimeout(h, 1500);
    });
  },
  pickVoice(persona, lang){
    const all = this.voices.length ? this.voices : (speechSynthesis.getVoices() || []);
    if (!all.length) return null;
    const voices = all.filter(v => !this.blocked.has(v.voiceURI));
    if (!voices.length) { this.blocked.clear(); return all[0]; }
    const override = S.settings.get('browserVoice:' + persona.id);
    if (override) { const v = voices.find(v => v.voiceURI === override || v.name === override); if (v) return v; }
    const pref = (lang || (book && book.language) || navigator.language || 'en').slice(0, 2).toLowerCase();
    let pool = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(pref));
    if (!pool.length) pool = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    if (!pool.length) pool = voices.slice();
    const quality = pool.filter(v => /premium|enhanced|natural|neural|siri/i.test(v.name));
    for (const hint of persona.browserHints || []) {
      const v = quality.find(v => v.name.toLowerCase().includes(hint.toLowerCase())) || pool.find(v => v.name.toLowerCase().includes(hint.toLowerCase()));
      if (v) return v;
    }
    return quality[0] || pool.find(v => v.localService) || pool.find(v => v.default) || pool[0];
  },
};
const est = { cps: +S.settings.get('ttsCps', 15.5) || 15.5 }; // characters per second at rate 1 (learned)

function chunkText(text, max){
  if (text.length <= max) return [{ text, offset: 0 }];
  const out = [];
  let pos = 0;
  while (pos < text.length) {
    let end = Math.min(text.length, pos + max);
    if (end < text.length) {
      const slice = text.slice(pos, end);
      let cut = Math.max(slice.lastIndexOf('; '), slice.lastIndexOf(', '), slice.lastIndexOf(': '), slice.lastIndexOf(' — '), slice.lastIndexOf('—'));
      if (cut < max * 0.4) cut = slice.lastIndexOf(' ');
      if (cut > 0) end = pos + cut + 1;
    }
    out.push({ text: text.slice(pos, end), offset: pos });
    pos = end;
  }
  return out.filter(c => c.text.trim().length);
}

function speakSentence(loc, startWord, mySession, delayMs){
  if (mySession !== session) return;
  const sent = T.sentenceAt(content, loc);
  if (!sent || !sent.words.length) return advanceSentence(mySession);
  startWord = U.clamp(startWord || 0, 0, sent.words.length - 1);
  const fromChar = sent.words[startWord].start;
  const text = sent.text.slice(fromChar);
  const chunks = chunkText(text, 190);
  const words = sent.words;
  setSentence(loc, startWord);
  const persona = X.persona();
  const voice = browser.pickVoice(persona, book && book.language);
  const go = () => speakChunk(0);
  if (delayMs) setTimeout(() => { if (mySession === session) go(); }, delayMs); else go();

  function speakChunk(ci){
    if (mySession !== session) return;
    if (ci >= chunks.length) return advanceSentence(mySession);
    const chunk = chunks[ci];
    const u = new SpeechSynthesisUtterance(chunk.text);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.rate = U.clamp(persona.rate * state.speed, 0.5, 3.5);
    u.pitch = U.clamp(persona.pitch, 0.5, 2);
    u.volume = 1;
    const chunkStartWord = wordAtChar(words, fromChar + chunk.offset);
    const chunkEndWord = wordAtChar(words, fromChar + chunk.offset + chunk.text.length - 1);
    let gotBoundary = false, startedAt = 0, ended = false, estTimer = null, estTick = null, watchdog = null;
    const stopEstimate = () => { if (estTick) { clearTimeout(estTick); estTick = null; } if (estTimer) { clearTimeout(estTimer); estTimer = null; } if (watchdog) { clearTimeout(watchdog); watchdog = null; } };
    // If the engine never reports a start, the voice is unusable here (typical for some remote voices offline): try another voice once, then give up clearly.
    watchdog = setTimeout(() => {
      if (startedAt || ended || mySession !== session) return;
      ended = true; stopEstimate();
      try { speechSynthesis.cancel(); } catch (err) {}
      if (voice && !browser.blocked.has(voice.voiceURI) && browser.voices.length > 1 && !speakSentence.retried) {
        browser.blocked.add(voice.voiceURI);
        speakSentence.retried = true;
        setTimeout(() => { if (mySession === session) speakSentence(loc, startWord, mySession, 0); }, 120);
        return;
      }
      speakSentence.retried = false;
      fail('The speech voice did not start. Pick another voice under Settings → Voices, or check that the device is not muted.');
    }, 4500);
    const runEstimate = () => {
      const cps = est.cps * u.rate;
      const tick = () => {
        if (ended || mySession !== session) return;
        const chars = ((performance.now() - startedAt) / 1000) * cps;
        let acc = 0, idx = chunkStartWord;
        for (let i = chunkStartWord; i <= chunkEndWord; i++) {
          const w = words[i];
          acc += w.text.length + 1 + (/[,;:]$/.test(w.text) ? 2 : /[.!?…]["”’)]*$/.test(w.text) ? 4 : 0);
          idx = i;
          if (acc > chars) break;
        }
        setWord(idx);
        estTick = setTimeout(tick, 70);
      };
      tick();
    };
    u.onstart = () => {
      if (mySession !== session) return;
      startedAt = performance.now();
      speakSentence.retried = false;
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      if (state.status !== 'playing') { state.status = 'playing'; state.loadingMsg = ''; emit(); }
      setWord(chunkStartWord);
      estTimer = setTimeout(() => { if (!gotBoundary && !ended && mySession === session) runEstimate(); }, 550);
    };
    u.onboundary = e => {
      if (mySession !== session || ended) return;
      if (e.name && e.name !== 'word') return;
      gotBoundary = true;
      if (estTick) { clearTimeout(estTick); estTick = null; }
      if (estTimer) { clearTimeout(estTimer); estTimer = null; }
      setWord(wordAtChar(words, fromChar + chunk.offset + (e.charIndex || 0)));
    };
    u.onend = () => {
      if (ended) return;
      ended = true;
      stopEstimate();
      if (mySession !== session) return;
      if (startedAt && !gotBoundary) {
        const dur = (performance.now() - startedAt) / 1000;
        if (dur > 0.5 && chunk.text.length > 20) {
          const observed = chunk.text.length / dur / u.rate;
          if (observed > 5 && observed < 40) { est.cps = est.cps * 0.7 + observed * 0.3; S.settings.set('ttsCps', Math.round(est.cps * 10) / 10); }
        }
      }
      speakChunk(ci + 1);
    };
    u.onerror = e => {
      if (ended) return;
      ended = true;
      stopEstimate();
      if (mySession !== session) return;
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      if (e.error === 'not-allowed') return fail('The browser blocked speech until you tap play again.');
      fail(`Speech failed (${e.error || 'unknown error'}). Try another voice in Settings.`);
    };
    currentUtterance = u;
    try { speechSynthesis.speak(u); } catch (err) { fail('Speech could not start: ' + err.message); }
  }
}

function advanceSentence(mySession){
  if (mySession !== session) return;
  const next = T.nextSentence(content, state.loc);
  if (!next) return finished();
  if (sleepShouldStop(next)) return sleepStop();
  const paragraphChanged = next.p !== state.loc.p || next.c !== state.loc.c;
  if (state.provider === 'browser') speakSentence(next, 0, mySession, paragraphChanged ? 350 : 0);
}

// =====================================================================
// Audio providers — per-paragraph units with word timing
// =====================================================================
let audioEl = null;
let unit = null;
const urlCache = new Map();
const MAX_UNIT_CHARS = 2400;

function unitsOfParagraph(c, p){
  const para = content.chapters[c].paras[p];
  const tok = T.tokenize(para);
  const units = [];
  // On-device generation can be slower than real time on weaker hardware, so keep its units short:
  // the first audio arrives sooner and the next unit is generated while this one plays.
  const maxChars = state.provider === 'kokoro' ? (kokoro.device === 'webgpu' ? 900 : 320) : MAX_UNIT_CHARS;
  let start = 0;
  while (start < tok.sentences.length) {
    let end = start, chars = 0;
    while (end < tok.sentences.length && (chars + tok.sentences[end].text.length <= maxChars || end === start)) { chars += tok.sentences[end].text.length + 1; end++; }
    const first = tok.sentences[start], last = tok.sentences[end - 1];
    units.push({ c, p, sStart: start, sEnd: end, charBase: first.start, text: para.slice(first.start, last.start + last.text.length) });
    start = end;
  }
  if (!units.length) units.push({ c, p, sStart: 0, sEnd: 0, charBase: 0, text: '' });
  return units;
}
function unitSentences(def){
  const tok = T.tokenize(content.chapters[def.c].paras[def.p]);
  const out = [];
  for (let s = def.sStart; s < def.sEnd; s++) out.push({ s, text: tok.sentences[s].text, len: tok.sentences[s].text.length });
  return out;
}
function unitWords(def){
  const tok = T.tokenize(content.chapters[def.c].paras[def.p]);
  const out = [];
  for (let s = def.sStart; s < def.sEnd; s++) {
    const sent = tok.sentences[s];
    sent.words.forEach((w, wi) => out.push({ s, w: wi, char: sent.start - def.charBase + w.start, len: w.text.length, text: w.text }));
  }
  return out;
}
function wordWeight(w){ return w.len + 1 + (/[,;:]$/.test(w.text) ? 2.5 : /[.!?…]["”’)]*$/.test(w.text) ? 5 : 0); }
/** Distribute word times over [start, end) proportional to weights. */
function spread(words, start, end){
  const weights = words.map(wordWeight);
  const total = weights.reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  return words.map((w, i) => { const a = start + acc / total * (end - start); acc += weights[i]; return { start: a, end: start + acc / total * (end - start) }; });
}
function estimateWordTimes(words, duration){ return spread(words, 0, duration); }
/** Exact sentence boundaries (segments: [{sStart, sEnd, start, end}]) with words spread inside each segment. */
function timesFromSegments(words, segments){
  const times = new Array(words.length);
  for (const seg of segments) {
    const idx = [];
    words.forEach((w, i) => { if (w.s >= seg.sStart && w.s < seg.sEnd) idx.push(i); });
    if (!idx.length) continue;
    const t = spread(idx.map(i => words[i]), seg.start, seg.end);
    idx.forEach((i, k) => { times[i] = t[k]; });
  }
  for (let i = 0; i < times.length; i++) if (!times[i]) times[i] = times[i - 1] || { start: 0, end: 0 };
  return times;
}
function blobDuration(blob){
  return new Promise((res) => {
    const a = new Audio();
    const url = URL.createObjectURL(blob);
    const done = d => { URL.revokeObjectURL(url); res(isFinite(d) && d > 0 ? d : null); };
    a.onloadedmetadata = () => done(a.duration);
    a.onerror = () => done(null);
    a.src = url;
    setTimeout(() => done(a.duration), 6000);
  });
}
function b64ToBlob(b64, type){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}
function escXml(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// ---------- ElevenLabs ----------
async function synthElevenLabs(text, persona){
  const key = S.settings.get('elevenlabsKey');
  if (!key) throw new Error('Add your ElevenLabs API key in Settings.');
  const voiceId = resolveElevenVoice(persona);
  if (!voiceId) throw new Error('No ElevenLabs voice is available. Open Settings → Voices and refresh the voice list.');
  const model = S.settings.get('elevenModel', 'eleven_multilingual_v2');
  const r = await U.fetchWithTimeout(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voiceId)}/with-timestamps?output_format=mp3_44100_128`, {
    method: 'POST', headers: { 'xi-api-key': key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, model_id: model, voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.15, use_speaker_boost: true } }),
  }, 120000);
  if (!r.ok) {
    let msg = `ElevenLabs error ${r.status}`;
    try { const j = await r.json(); msg += ': ' + ((j.detail && (j.detail.message || j.detail.status)) || JSON.stringify(j).slice(0, 160)); } catch (e) {}
    if (r.status === 401) msg = 'ElevenLabs rejected the API key (401). Check it in Settings.';
    throw new Error(msg);
  }
  const j = await r.json();
  const al = j.alignment || j.normalized_alignment;
  return { blob: b64ToBlob(j.audio_base64, 'audio/mpeg'), chars: al ? { starts: al.character_start_times_seconds, ends: al.character_end_times_seconds, n: (al.characters || []).length } : null };
}
X.fetchElevenVoices = async () => {
  const key = S.settings.get('elevenlabsKey');
  if (!key) throw new Error('Add your ElevenLabs API key first.');
  const j = await U.fetchJSON('https://api.elevenlabs.io/v1/voices', { headers: { 'xi-api-key': key } }, 20000);
  const voices = (j.voices || []).map(v => ({ id: v.voice_id, name: v.name, labels: Object.values(v.labels || {}).map(x => String(x).toLowerCase()), category: v.category }));
  await S.settings.set('elevenVoices', voices);
  return voices;
};
function resolveElevenVoice(persona){
  const override = S.settings.get('elevenVoice:' + persona.id);
  if (override) return override;
  const voices = S.settings.get('elevenVoices', []);
  if (!voices.length) return null;
  let best = null, bestScore = -1;
  for (const v of voices) {
    const text = (v.labels || []).join(' ') + ' ' + v.name.toLowerCase();
    let score = 0;
    for (const l of persona.labels) if (text.includes(l)) score += 1;
    if (v.category === 'premade') score += 0.2;
    if (score > bestScore) { bestScore = score; best = v; }
  }
  return best ? best.id : voices[0].id;
}
X.resolveElevenVoice = resolveElevenVoice;

// ---------- OpenAI ----------
async function synthOpenAI(text, persona){
  const key = S.settings.get('openaiKey');
  if (!key) throw new Error('Add your OpenAI API key in Settings.');
  const model = S.settings.get('openaiTtsModel', 'gpt-4o-mini-tts');
  const voice = S.settings.get('openaiVoice:' + persona.id) || persona.openaiVoice;
  const body = { model, voice, input: text, response_format: 'mp3' };
  if (/gpt-4o|gpt-4\.1|gpt-5/.test(model)) body.instructions = persona.instructions;
  const r = await U.fetchWithTimeout('https://api.openai.com/v1/audio/speech', { method: 'POST', headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, 120000);
  if (!r.ok) {
    let msg = `OpenAI error ${r.status}`;
    try { const j = await r.json(); msg += ': ' + ((j.error && j.error.message) || '').slice(0, 200); } catch (e) {}
    if (r.status === 401) msg = 'OpenAI rejected the API key (401). Check it in Settings.';
    throw new Error(msg);
  }
  return { blob: await r.blob(), chars: null };
}

// ---------- Google Cloud Text-to-Speech ----------
const GOOGLE_TTS = 'https://texttospeech.googleapis.com/v1beta1';
X.fetchGoogleVoices = async () => {
  const key = S.settings.get('googleTtsKey');
  if (!key) throw new Error('Add your Google Cloud API key first.');
  const j = await U.fetchJSON(`${GOOGLE_TTS}/voices?languageCode=en&key=${encodeURIComponent(key)}`, {}, 20000);
  const voices = (j.voices || []).filter(v => /Chirp3-HD|Neural2|Studio|Wavenet/i.test(v.name)).map(v => ({ name: v.name, gender: (v.ssmlGender || '').toLowerCase(), lang: (v.languageCodes || [])[0] || 'en-US', family: /Chirp3-HD/i.test(v.name) ? 'Chirp 3 HD' : /Neural2/i.test(v.name) ? 'Neural2' : /Studio/i.test(v.name) ? 'Studio' : 'WaveNet' }))
    .sort((a, b) => ['Chirp 3 HD', 'Studio', 'Neural2', 'WaveNet'].indexOf(a.family) - ['Chirp 3 HD', 'Studio', 'Neural2', 'WaveNet'].indexOf(b.family) || a.name.localeCompare(b.name));
  await S.settings.set('googleVoices', voices);
  return voices;
};
function resolveGoogleVoice(persona){
  const override = S.settings.get('googleVoice:' + persona.id);
  if (override) return override;
  const list = S.settings.get('googleVoices', []);
  const prefs = [].concat(persona.googleVoice || []);
  if (list.length) {
    for (const p of prefs) if (list.find(v => v.name === p)) return p;
    const hd = list.find(v => v.family === 'Chirp 3 HD' && v.lang === 'en-US') || list[0];
    return hd.name;
  }
  return prefs[0] || 'en-US-Chirp3-HD-Charon';
}
X.resolveGoogleVoice = resolveGoogleVoice;
async function synthGoogle(def, persona){
  const key = S.settings.get('googleTtsKey');
  if (!key) throw new Error('Add your Google Cloud API key in Settings.');
  const name = resolveGoogleVoice(persona);
  const languageCode = name.split('-').slice(0, 2).join('-');
  const chirp = /Chirp/i.test(name);
  const sentences = def.sentences || [{ s: 0, text: def.text }];
  const body = { voice: { languageCode, name }, audioConfig: { audioEncoding: 'MP3', speakingRate: U.clamp(persona.rate || 1, 0.5, 1.5) } };
  if (chirp) body.input = { text: def.text };
  else { body.input = { ssml: '<speak>' + sentences.map((x, i) => `<mark name="s${i}"/>` + escXml(x.text)).join(' ') + '</speak>' }; body.enableTimePointing = ['SSML_MARK']; }
  const r = await U.fetchWithTimeout(`${GOOGLE_TTS}/text:synthesize?key=${encodeURIComponent(key)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, 60000);
  if (!r.ok) {
    let msg = `Google Cloud TTS error ${r.status}`;
    try { const j = await r.json(); msg += ': ' + ((j.error && j.error.message) || '').slice(0, 220); } catch (e) {}
    if (r.status === 403) msg += ' (check that the Text-to-Speech API is enabled and the key allows this website)';
    throw new Error(msg);
  }
  const j = await r.json();
  const blob = b64ToBlob(j.audioContent, 'audio/mpeg');
  let segments = null;
  if (j.timepoints && j.timepoints.length && sentences.length) {
    const starts = j.timepoints.map(tp => ({ i: +String(tp.markName).slice(1), t: +tp.timeSeconds })).sort((a, b) => a.i - b.i);
    const duration = await blobDuration(blob);
    segments = starts.map((st, k) => ({ sStart: sentences[st.i].s, sEnd: sentences[st.i].s + 1, start: st.t, end: k + 1 < starts.length ? starts[k + 1].t : (duration || st.t + 3) }));
  }
  return { blob, chars: null, segments };
}

// ---------- Kokoro (on-device) ----------

function voiceKey(){

    case 'elevenlabs': return `${resolveElevenVoice(persona)}|${S.settings.get('elevenModel', 'eleven_multilingual_v2')}`;
    case 'openai': return `${S.settings.get('openaiVoice:' + persona.id) || persona.openaiVoice}|${S.settings.get('openaiTtsModel', 'gpt-4o-mini-tts')}|${persona.id}`;
    case 'google': return `${resolveGoogleVoice(persona)}|${persona.rate}`;

}

X.play = async (loc) => {
  if (!book || !content) return fail('Open a book first.');
  if (!X.providerReady(state.provider)) { state.provider = 'browser'; S.settings.set('ttsProvider', 'browser'); }
  if (state.provider === 'browser' && !X.providerReady('browser')) return fail('This browser has no speech voices. Use the on-device voice or add a provider key in Settings.');
  session++;
  const mySession = session;
  stopEngines();
  loc = T.clampLoc(content, loc || Object.assign({ w: Math.max(0, state.word) }, state.loc || T.firstLoc()));
  state.error = null;
  state.loc = { c: loc.c, p: loc.p, s: loc.s }; state.word = loc.w || 0;
  if (state.sleepMode > 0 && !state.sleepAt) state.sleepAt = Date.now() + state.sleepMode * 60000;
  if (state.provider === 'browser') {
    state.status = 'loading'; state.loadingMsg = 'Starting…'; emit();
    if (!browser.voices.length) browser.voices = await browser.loadVoices();
    if (mySession !== session) return;
    setTimeout(() => { if (mySession === session) speakSentence(loc, loc.w || 0, mySession, 0); }, 60);
  } else {
    playUnitFrom(loc, mySession);
  }
};
function stopEngines(){

  if (audioEl) { try { audioEl.pause(); } catch (e) {} }
}
X.pause = () => {
  if (state.status === 'idle') return;
  session++;
  stopEngines();
  state.status = 'paused'; state.loadingMsg = '';

};
X.resume = () => { if (state.status === 'paused' || state.status === 'idle') X.play(Object.assign({ w: Math.max(0, state.word) }, state.loc || T.firstLoc())); };
X.toggle = () => { if (X.isPlaying()) X.pause(); else X.resume(); };
X.stop = () => {
  session++;
  stopEngines();
  state.status = 'idle'; state.loadingMsg = '';
  emit();
};
X.seek = (loc) => {
  if (!content) return;
  loc = T.clampLoc(content, loc);
  if (X.isPlaying()) X.play(loc);
  else { state.loc = { c: loc.c, p: loc.p, s: loc.s }; state.word = loc.w || 0; F.bus.emit('tts-sentence', Object.assign({}, loc)); F.bus.emit('tts-word', Object.assign({}, loc)); emit(); }

  const step = n > 0 ? T.nextSentence : T.prevSentence;
  for (let i = 0; i < Math.abs(n); i++) { const nx = step(content, loc); if (!nx) break; loc = nx; }

  const target = n > 0 ? T.nextParagraph(content, loc) : (state.loc && (state.loc.s > 0 || state.word > 3) ? T.paragraphStart(loc) : T.prevParagraph(content, loc));
  if (target) X.seek(target);
};
X.setSpeed = (x) => {
  state.speed = U.clamp(+x || 1, 0.5, 3);
  S.settings.set('ttsSpeed', state.speed);
  if (audioEl && state.provider !== 'browser') audioEl.playbackRate = state.speed;
  else if (state.provider === 'browser' && X.isPlaying()) X.play(Object.assign({ w: Math.max(0, state.word) }, state.loc));

X.setPersona = (id) => {

/** Speak a short sample in the current provider with the given persona (for Settings and the voice popover). */
X.preview = async (personaId) => {
  const persona = C.PERSONAS.find(p => p.id === personaId) || X.persona();
  const sample = 'This is how I read. Chapter one begins on a quiet morning, and the pages turn at your pace.';
  if (state.provider === 'browser') {
    if (!browser.available()) throw new Error('No browser voices available.');
    if (!browser.voices.length) browser.voices = await browser.loadVoices();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sample);
    const v = browser.pickVoice(persona, 'en');
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = U.clamp(persona.rate * state.speed, 0.5, 3.5); u.pitch = persona.pitch;
    currentUtterance = u;
    speechSynthesis.speak(u);
    return;
  }
  const saved = state.personaId; state.personaId = persona.id;
  try {
    const def = { text: sample, sentences: T.splitSentences(sample).map((s, i) => ({ s: i, text: s.text, len: s.text.length })) };
    const { blob } = await synthesize(def);
    const a = new Audio(URL.createObjectURL(blob)); a.playbackRate = state.speed; await a.play();
  } finally { state.personaId = saved; }
};

<script>
/* ==== 08_calibration.js ==== */
/* 08_calibration.js — physical-book calibration: shingle index, OCR-to-edition matching, page <-> position mapping */
(function(){
'use strict';
const F = window.F;
const T = F.text, S = F.store, U = F.util, C = F.C;
const K = F.calib = {};

const SH = 4;                 // words per shingle
const P_MUL = 1e4, C_MUL = 1e8; // packing: c*1e8 + p*1e4 + normalizedWordIndex
const indexCache = new Map();  // bookId -> { index: Map<string, number[]>, normLens: number[][] }

/** Normalized tokens of a paragraph plus a map from normalized index -> {s, w} display locator parts. */
function paraNorm(para){
  const tok = T.tokenize(para);
  const toks = [], map = [];
  tok.sentences.forEach((sent, si) => sent.words.forEach((wd, wi) => {
    const parts = T.normWords(wd.text);
    for (const p of parts) { toks.push(p); map.push({ s: si, w: wi }); }
  }));

}
K.paraNorm = paraNorm;

K.buildIndex = async function(bookId, content, onProgress){
  const cached = indexCache.get(bookId);
  if (cached) return cached;
  const index = new Map();
  const normLens = [];
  let n = 0;
  const total = content.chapters.length;
  for (let c = 0; c < total; c++) {
    const ch = content.chapters[c];
    normLens.push([]);
    for (let p = 0; p < ch.paras.length; p++) {
      const { toks } = paraNorm(ch.paras[p]);
      normLens[c].push(toks.length);
      for (let i = 0; i + SH <= toks.length; i++) {
        const key = toks[i] + ' ' + toks[i + 1] + ' ' + toks[i + 2] + ' ' + toks[i + 3];
        let arr = index.get(key);
        if (!arr) { arr = []; index.set(key, arr); }
        if (arr.length < 64) arr.push(c * C_MUL + p * P_MUL + i);
      }
      n++;

K.invalidate = bookId => indexCache.delete(bookId);
K.isIndexed = bookId => indexCache.has(bookId);

function unpack(v){
  const c = Math.floor(v / C_MUL);
  const rem = v - c * C_MUL;
  const p = Math.floor(rem / P_MUL);
  return { c, p, nw: rem - p * P_MUL };

/** Convert (chapter, paragraph, normalized word index possibly out of range) into a display locator. */
function toLoc(content, normLens, c, p, nw){
  const ch = content.chapters[c];
  const lens = normLens[c];

  if (!sent) return '';

  for (let si = loc.s; si < tok.sentences.length && all.length < words; si++) {
    const s = tok.sentences[si];
    const startW = si === loc.s ? loc.w : 0;
    for (let wi = startW; wi < s.words.length && all.length < words; wi++) all.push(s.words[wi].text);

    queryShingles++;

K.getCal = async bookId => (await S.get('calibration', bookId)) || { bookId, points: [], totalPages: null };
K.addPoint = async (bookId, content, page, loc, confidence) => {

  const cal = await K.getCal(bookId);

};

  const cal = await K.getCal(bookId);

// ---------- mapping ----------
K.wordsPerPage = (cal, totalWords) => {
  const pts = (cal && cal.points) || [];

    const a = pts[0], b = pts[pts.length - 1];

K.hasMapping = cal => !!(cal && (cal.points.length || cal.totalPages));
K.pageToGlobal = (cal, page, totalWords) => {
  if (!K.hasMapping(cal)) return null;
  const pts = cal.points;
  const wpp = K.wordsPerPage(cal, totalWords);
  if (!pts.length) return U.clamp(Math.round((page - 1) * wpp), 0, totalWords);
  if (page <= pts[0].page) return U.clamp(Math.round(pts[0].g - (pts[0].page - page) * wpp), 0, totalWords);

  if (page >= lastPt.page) return U.clamp(Math.round(lastPt.g + (page - lastPt.page) * wpp), 0, totalWords);
  for (let i = 0; i < pts.length - 1; i++) {

})();

    else if (act === 'details') { hidePopover(); F.ui.openBook(st.book.id, { fromReader: true }); }

  };
  els.popover.onchange = e => { const t = e.target.closest('[data-act]'); if (!t) return; if (t.dataset.act === 'font') { S.settings.set('font', t.value).then(() => R.applyPrefs(true)); } };
  els.popover.oninput = e => { const t = e.target.closest('[data-act="speed"]'); if (t) { F.tts.setSpeed(+t.value); const v = els.popover.querySelector('#rd-speed-v'); if (v) v.textContent = (+t.value).toFixed(2).replace(/0$/, '') + '×'; } };
}

// ---------- physical (paper) mode ----------
function showPhysical(){

function fmtClock(ms){ const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0'); }

  const info = mapped
    ? `Digital position: ${esc(st.content.chapters[loc.c].title)} · ${Math.round(T.percent(st.content, loc) * 100)}%${total ? ` · about ${total} pages in your edition` : ''}. Quality: ${F.calib.quality(cal)}.`
    : 'No page mapping yet. Calibrate with a photo of a page (or set the total pages in Book details) so check-ins move your digital position too.';
  els.physical.innerHTML = `
    <div><div class="eyebrow">Paper mode</div><div class="ph-title">${esc(st.book.title)}</div><div class="muted">${esc(st.book.author || '')}</div></div>
    <div class="ph-timer ${physRunning ? 'running' : ''}" id="ph-timer">${fmtClock(physAccum + (physRunning ? Date.now() - physStart : 0))}</div>
    <div class="row"><button class="btn primary" id="ph-toggle">${I(physRunning ? 'pause' : 'play')} ${physRunning ? 'Pause timer' : (physAccum ? 'Resume timer' : 'Start timer')}</button><button class="btn" id="ph-end" ${physAccum || physRunning ? '' : 'disabled'}>End session</button></div>
    <div class="card ph-card"><div class="field" style="margin-top:0"><label>Page you're on</label><div class="stepper"><button class="ibtn" id="ph-minus" aria-label="Previous page">−</button><input class="input" id="ph-page" type="number" inputmode="numeric" min="1" value="${page}" placeholder="—"><button class="ibtn" id="ph-plus" aria-label="Next page">+</button></div></div><button class="btn primary" id="ph-checkin">${I('check')} Check in</button><div class="muted small" style="margin-top:10px">${info}</div></div>
    <div class="row"><button class="btn sm" id="ph-calib">${I('target')} Calibrate with a photo</button><button class="btn sm" id="ph-digital">${I('text')} Read this spot on screen</button></div>`;
  const $ = id => els.physical.querySelector('#' + id);
  $('ph-toggle').onclick = () => { if (physRunning) pausePhysicalTimer(); else startPhysicalTimer(); renderPhysical(); };
  $('ph-end').onclick = async () => { const ms = physAccum + (physRunning ? Date.now() - physStart : 0); stopPhysicalTimer(); const s = await F.analytics.end(); F.ui.toast(s ? `Session saved: ${T.formatDuration(ms / 1000)}${s.pages ? ` · ${s.pages} pages` : ''}.` : 'Session was too short to keep.'); renderPhysical(); };
  $('ph-minus').onclick = () => { const i = $('ph-page'); i.value = Math.max(1, (+i.value || 1) - 1); };
  $('ph-plus').onclick = () => { const i = $('ph-page'); i.value = (+i.value || 0) + 1; };
  $('ph-checkin').onclick = () => checkIn(+$('ph-page').value);
  $('ph-calib').onclick = () => F.ui.calibrate(st.book.id, { fromReader: true });
  $('ph-digital').onclick = () => hidePhysical();
}
function startPhysicalTimer(){
  if (physRunning) return;
  physRunning = true; physStart = Date.now();
  F.analytics.begin(st.book.id, 'physical', { page: progress.physicalPage || undefined, g: progress.loc ? T.locToGlobal(st.content, progress.loc) : undefined });
  physTimer = setInterval(() => { const t = els.physical.querySelector('#ph-timer'); if (t) t.textContent = fmtClock(physAccum + Date.now() - physStart); F.analytics.touch(); }, 1000);
}
function pausePhysicalTimer(){ if (!physRunning) return; physAccum += Date.now() - physStart; physRunning = false; clearInterval(physTimer); physTimer = null; }
function stopPhysicalTimer(){ pausePhysicalTimer(); physAccum = 0; }
async function checkIn(page){
  if (!page || page < 1) { F.ui.toast('Enter the page number you are on.', { type: 'error' }); return; }
  const totalWords = st.content.totalWords;
  if (F.calib.hasMapping(cal)) {
    const g = F.calib.pageToGlobal(cal, page, totalWords);
    const loc = T.globalToLoc(st.content, g);
    await saveProgressNow(loc, { physicalPage: page });
    F.analytics.update({ page, g });
    F.ui.toast(`Checked in at page ${page} · ${Math.round(T.percent(st.content, loc) * 100)}% · ${st.content.chapters[loc.c].title}`);
  } else {
    progress = Object.assign(progress || { bookId: st.book.id }, { physicalPage: page, updatedAt: Date.now() });
    if (cal && cal.totalPages) progress.percent = U.clamp(page / cal.totalPages, 0, 1);
    await S.put('progress', progress);
    F.bus.emit('progress', { bookId: st.book.id, progress });
    F.analytics.update({ page });
    F.ui.toast(`Checked in at page ${page}. Add a calibration photo to sync the digital text.`);
  }
  if (!physRunning) startPhysicalTimer();
  renderPhysical();
}
})();

<script>
/* ==== 09_analytics.js ==== */
/* 09_analytics.js — reading sessions, streaks, daily stats, Reading Label, Taste Profile */
(function(){
'use strict';
const F = window.F;
const U = F.util, T = F.text, S = F.store;
const A = F.analytics = {};

const IDLE_MS = 2 * 60 * 1000;      // inactivity beyond this is not counted
const MIN_SESSION_MS = 20 * 1000;   // shorter sessions are discarded
let cur = null;                     // active session
let heartbeat = null;

function now(){ return Date.now(); }
function persist(open){
  if (!cur) return Promise.resolve();
  const rec = {
    id: cur.id, bookId: cur.bookId, mode: cur.mode, start: cur.start, end: now(), day: U.dayKey(new Date(cur.start)),
    ms: cur.ms, minutes: Math.round(cur.ms / 6000) / 10,
    gStart: cur.gStart, gEnd: cur.gEnd, words: Math.max(0, (cur.gEnd || 0) - (cur.gStart || 0)),
    pageStart: cur.pageStart, pageEnd: cur.pageEnd, pages: (cur.pageEnd != null && cur.pageStart != null) ? Math.max(0, cur.pageEnd - cur.pageStart) : 0,
    open: !!open,
  };
  return S.put('sessions', rec).catch(e => console.warn('session save failed', e));
}

/** Begin (or continue) a session. mode: read | listen | physical. pos: { g, page } */
A.begin = (bookId, mode, pos = {}) => {
  if (cur && cur.bookId === bookId && cur.mode === mode) { A.touch(); A.update(pos); return cur; }
  if (cur) A.end();
  cur = { id: U.uuid(), bookId, mode, start: now(), last: now(), ms: 0, gStart: pos.g ?? null, gEnd: pos.g ?? null, pageStart: pos.page ?? null, pageEnd: pos.page ?? null };
  if (!heartbeat) heartbeat = setInterval(() => { if (cur) persist(true); }, 30000);
  F.bus.emit('session', { type: 'begin', session: cur });
  return cur;
};
A.touch = () => {
  if (!cur) return;
  const t = now();
  cur.ms += Math.min(IDLE_MS, t - cur.last);
  cur.last = t;
};
A.update = (pos = {}) => {
  if (!cur) return;
  A.touch();
  if (pos.g != null) { if (cur.gStart == null) cur.gStart = pos.g; cur.gEnd = pos.g; }
  if (pos.page != null) { if (cur.pageStart == null) cur.pageStart = pos.page; cur.pageEnd = pos.page; }
};
A.end = async () => {
  if (!cur) return null;
  A.touch();
  const s = cur;
  cur = null;
  if (heartbeat) { clearInterval(heartbeat); heartbeat = null; }
  if (s.ms < MIN_SESSION_MS && (s.gEnd || 0) - (s.gStart || 0) < 30) { try { await S.del('sessions', s.id); } catch (e) {} F.bus.emit('session', { type: 'discard' }); return null; }
  cur = s; await persist(false); cur = null;
  F.bus.emit('session', { type: 'end', session: s });
  return s;
};
A.current = () => cur;
A.isActive = () => !!cur && (now() - cur.last) < IDLE_MS;

/** Close any sessions left open by a crash / tab close. */
A.recover = async () => {
  const rows = await S.all('sessions');
  for (const r of rows) {
    if (r.open) { r.open = false; if (r.ms < MIN_SESSION_MS) await S.del('sessions', r.id); else await S.put('sessions', r); }
  }
};
document.addEventListener('visibilitychange', () => { if (document.hidden && cur) persist(true); });
window.addEventListener('pagehide', () => { if (cur) persist(true); });

// ---------- aggregate stats ----------
A.getSessions = async () => (await S.all('sessions')).filter(s => !s.open || (now() - s.end) < 90000).sort((a, b) => a.start - b.start);
A.daily = (sessions, days = 30) => {
  const out = [];
  const today = U.dayKey();
  let key = U.addDays(today, -(days - 1));
  const byDay = {};
  for (const s of sessions) { const d = byDay[s.day] || (byDay[s.day] = { minutes: 0, words: 0, sessions: 0, listen: 0 }); d.minutes += s.minutes || 0; d.words += s.words || 0; d.sessions++; if (s.mode === 'listen') d.listen += s.minutes || 0; }
  for (let i = 0; i < days; i++) { out.push(Object.assign({ day: key }, byDay[key] || { minutes: 0, words: 0, sessions: 0, listen: 0 })); key = U.addDays(key, 1); }
  return out;
};
A.streak = (sessions, minMinutes = 1) => {
  const days = new Set();
  const byDay = {};
  for (const s of sessions) byDay[s.day] = (byDay[s.day] || 0) + (s.minutes || 0);
  for (const [d, m] of Object.entries(byDay)) if (m >= minMinutes) days.add(d);
  const today = U.dayKey();
  let current = 0, cursor = days.has(today) ? today : U.addDays(today, -1);
  while (days.has(cursor)) { current++; cursor = U.addDays(cursor, -1); }
  let best = 0;
  const sorted = Array.from(days).sort();
  let run = 0, prev = null;
  for (const d of sorted) { run = (prev && U.addDays(prev, 1) === d) ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return { current, best, activeDays: days.size, today: days.has(today) };
};
A.totals = (sessions, books) => {
  const minutes = sessions.reduce((a, s) => a + (s.minutes || 0), 0);
  const words = sessions.reduce((a, s) => a + (s.words || 0), 0);
  const listen = sessions.filter(s => s.mode === 'listen').reduce((a, s) => a + (s.minutes || 0), 0);
  const physical = sessions.filter(s => s.mode === 'physical').reduce((a, s) => a + (s.minutes || 0), 0);
  return { minutes, words, sessions: sessions.length, listenMinutes: listen, physicalMinutes: physical, books: books.length, finished: books.filter(b => b.finishedAt).length };
};
A.bookStats = (sessions, bookId) => {
  const mine = sessions.filter(s => s.bookId === bookId);
  const read = mine.filter(s => s.mode === 'read' && s.words > 30 && s.minutes >= 0.5);
  const listen = mine.filter(s => s.mode === 'listen');
  const minutes = mine.reduce((a, s) => a + (s.minutes || 0), 0);
  const rWords = read.reduce((a, s) => a + s.words, 0), rMin = read.reduce((a, s) => a + s.minutes, 0);
  return {
    minutes, sessions: mine.length, words: mine.reduce((a, s) => a + (s.words || 0), 0),
    wpm: rMin >= 1 ? Math.round(rWords / rMin) : null,
    listenMinutes: listen.reduce((a, s) => a + (s.minutes || 0), 0),
    physicalMinutes: mine.filter(s => s.mode === 'physical').reduce((a, s) => a + (s.minutes || 0), 0),
    lastRead: mine.length ? Math.max(...mine.map(s => s.end)) : null,
    firstRead: mine.length ? Math.min(...mine.map(s => s.start)) : null,
  };
};
A.userWpm = sessions => {
  const read = sessions.filter(s => s.mode === 'read' && s.words > 30 && s.minutes >= 0.5);
  const w = read.reduce((a, s) => a + s.words, 0), m = read.reduce((a, s) => a + s.minutes, 0);
  return m >= 2 ? Math.round(w / m) : null;
};

// ---------- Reading Label (nutrition-label style facts about one book) ----------
A.label = (book, stats, progress, library) => {
  const words = book.words || 0;
  const wpm = stats.wpm || library.wpm || 230;
  const r = book.readability || {};
  const chapters = book.chapterCount || 1;
  const libWords = library.medianWords || 90000;
  const listenShare = stats.minutes ? stats.listenMinutes / stats.minutes : 0;
  const percent = progress ? progress.percent || 0 : 0;
  return {
    words, hours: words / wpm / 60, chapters, avgChapterWords: Math.round(words / chapters),
    lengthBand: words < 25000 ? 'Novella-length' : words < 60000 ? 'Short novel' : words < 110000 ? 'Full-length novel' : words < 200000 ? 'Long read' : 'Epic',
    lengthDV: libWords ? words / libWords : 1,
    pace: { yourWpm: stats.wpm, avgWpm: library.wpm, compare: stats.wpm && library.wpm ? (stats.wpm > library.wpm * 1.1 ? 'faster than your usual' : stats.wpm < library.wpm * 0.9 ? 'slower than your usual' : 'your usual pace') : null },
    complexity: { band: r.band || '–', flesch: r.flesch, grade: r.grade, wps: r.wordsPerSentence, spw: r.syllablesPerWord, longWords: r.longWordShare },
    dialogue: r.dialogueShare == null ? null : r.dialogueShare,
    genre: (book.subjects || []).slice(0, 6),
    completion: percent, minutes: stats.minutes, sessions: stats.sessions, listenShare,
    finished: !!book.finishedAt || percent >= 0.98,
  };
};

// ---------- Taste Profile ----------
A.profile = (books, sessions, progressMap) => {
  const subjectWeights = new Map();
  const authorWeights = new Map();
  const langCount = {};
  let weightedWpm = 0, wpmWeight = 0;
  const finishedWords = [];
  let started = 0, finished = 0, listenMin = 0, totalMin = 0;
  const hours = new Array(24).fill(0);
  const bookMinutes = {};
  for (const s of sessions) { bookMinutes[s.bookId] = (bookMinutes[s.bookId] || 0) + (s.minutes || 0); totalMin += s.minutes || 0; if (s.mode === 'listen') listenMin += s.minutes || 0; hours[new Date(s.start).getHours()] += s.minutes || 0; }
  for (const b of books) {
    const p = progressMap[b.id] || { percent: 0 };
    const min = bookMinutes[b.id] || 0;
    const done = !!b.finishedAt || p.percent >= 0.98;
    if (p.percent > 0.02 || min > 2) started++;
    if (done) { finished++; finishedWords.push(b.words || 0); }
    const w = 0.25 + 0.75 * (p.percent || 0) + (done ? 0.6 : 0) + Math.min(1, min / 120) * 0.6;
    for (const s of b.subjects || []) { const k = T.normalize(s); if (!k) continue; const e = subjectWeights.get(k) || { name: s, weight: 0, books: 0 }; e.weight += w; e.books++; subjectWeights.set(k, e); }
    if (b.author) { const k = T.normalize(b.author.split(/,|&| and /)[0]); if (k) { const e = authorWeights.get(k) || { name: b.author.split(/,|&| and /)[0].trim(), weight: 0, books: 0 }; e.weight += w; e.books++; authorWeights.set(k, e); } }
    if (b.language) { const l = b.language.slice(0, 2).toLowerCase(); langCount[l] = (langCount[l] || 0) + 1; }
    const st = A.bookStats(sessions, b.id);
    if (st.wpm) { weightedWpm += st.wpm * st.minutes; wpmWeight += st.minutes; }
  }
  const topSubjects = Array.from(subjectWeights.values()).sort((a, b) => b.weight - a.weight).slice(0, 8);
  const maxW = topSubjects.length ? topSubjects[0].weight : 1;
  topSubjects.forEach(s => { s.weight = Math.round(s.weight / maxW * 100) / 100; });
  const topAuthors = Array.from(authorWeights.values()).sort((a, b) => b.weight - a.weight).slice(0, 5);
  const medianWords = arr => { if (!arr.length) return null; const a = arr.slice().sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; };
  const prefWords = medianWords(finishedWords.length ? finishedWords : books.filter(b => (progressMap[b.id] || {}).percent > 0.3).map(b => b.words || 0));
  const slotNames = ['night owl', 'early riser', 'morning reader', 'afternoon reader', 'evening reader', 'bedtime reader'];
  const slots = [hours.slice(0, 5).reduce((a, b) => a + b, 0), hours.slice(5, 8).reduce((a, b) => a + b, 0), hours.slice(8, 12).reduce((a, b) => a + b, 0), hours.slice(12, 17).reduce((a, b) => a + b, 0), hours.slice(17, 21).reduce((a, b) => a + b, 0), hours.slice(21, 24).reduce((a, b) => a + b, 0)];
  const bestSlot = slots.indexOf(Math.max(...slots));
  const language = Object.entries(langCount).sort((a, b) => b[1] - a[1])[0];
  return {
    topSubjects, subjectSet: new Set(topSubjects.map(s => T.normalize(s.name))), topAuthors,
    avgWpm: wpmWeight ? Math.round(weightedWpm / wpmWeight) : A.userWpm(sessions),
    preferredWords: prefWords, preferredPages: prefWords ? Math.round(prefWords / 280) : null,
    completionRate: started ? finished / started : null, started, finished,
    listenShare: totalMin ? listenMin / totalMin : 0, totalMinutes: totalMin,
    timeOfDay: totalMin > 10 ? slotNames[bestSlot] : null, hours,
    language: language ? language[0] : 'en',
    medianWords: medianWords(books.map(b => b.words || 0)),
    label: totalMin < 5 ? 'Just getting started' : pickArchetype(topSubjects, listenMin / (totalMin || 1), finished, started),
  };
};
function pickArchetype(subjects, listenShare, finished, started){
  const s = subjects.map(x => T.normalize(x.name)).join(' ');
  let base = /fantasy|science fiction|adventure/.test(s) ? 'World-builder' : /mystery|detective|crime|thriller/.test(s) ? 'Puzzle-solver' : /history|biography|science|philosophy|essays|politics/.test(s) ? 'Deep-diver' : /romance|love|domestic/.test(s) ? 'Heart-first reader' : /poetry|drama|plays/.test(s) ? 'Language-lover' : /children|fairy|juvenile|nonsense/.test(s) ? 'Wonder-seeker' : 'Wide-ranging reader';
  if (listenShare > 0.6) base += ', mostly by ear';
  else if (finished >= 3 && started && finished / started > 0.7) base += ', a finisher';
  return base;
}
})();

(function(){
'use strict';
const F = window.F;
const U = F.util, T = F.text, S = F.store, C = F.C;
const UI = F.ui = {};
const esc = U.esc;
